# ###########################################################################
#  TEMPORAL. Solo para la fase de pruebas en el PC. Borrar al pasar a Umbrel.
# ###########################################################################
#
# Existe para una sola cosa: poder abrir el formulario desde el móvil por la
# mañana mientras se compara lo que decide el sistema con lo que uno habría
# hecho. En cuanto eso esté estable, el destino es Umbrel (ver `umbrel/`), y
# entonces ESTE FICHERO SOBRA: allí el `app_proxy` hace lo mismo y mejor.
#
# Y "TEMPORAL" aquí arriba no es un plazo, es una intención -las que peor han
# envejecido en este repositorio-. El plazo de verdad está en
# `tests/test_andamiaje.py`, que se pone rojo cuando se cumple y dice qué hay
# que borrar. Ese fichero ata además lo que este compose AFIRMA sobre otros: el
# puerto que reserva Umbrel, dónde escucha la aplicación, que el 8000 no salga
# del bucle local, y que `AUTH_FRONT` cuente lo que el proxy hace de verdad.
#
# ESTO VA SIN CONTRASEÑA, A PROPÓSITO
# -----------------------------------
# Llevaba un `basic_auth` en el Caddyfile con un hash en `.env.pruebas-lan`.
# Se ha quitado a petición expresa: red de casa, un solo usuario, y un login
# más delante de un formulario que se abre medio dormido a las siete de la
# mañana no compensaba.
#
# LO QUE QUEDA EXPUESTO, escrito para que nadie tenga que deducirlo: cualquier
# cacharro del wifi puede pedir `/api/export` -el histórico entero: sueño, HRV,
# RPE y el registro de la lumbar- y puede llamar a `POST /api/checkin`, que no
# solo lee: crea un check-in y dispara una decisión. `DRY_RUN=true` hoy corta
# la escritura, pero el propósito de esta fase es llegar a quitarlo, así que no
# cuenta como protección: el riesgo empeora justo el día en que uno ha dejado
# de pensar en él.
#
# Y NO VIAJA. En Umbrel va el `app_proxy` delante, que sí pide login. Para que
# la decisión no se cuele en otro despliegue por descuido, la aplicación lo
# canta en el log en cada arranque (ver `AUTH_FRONT` en `app/settings.py`). El
# `AUTH_FRONT=ninguna` de aquí abajo es lo que hace que ese aviso diga "a
# propósito" en vez de "nadie ha declarado qué hay delante".
#
# POR QUÉ SIGUE HABIENDO UN PROXY SI YA NO PIDE NADA
# --------------------------------------------------
# Por dos razones que sobreviven a la contraseña. Una: el 8000 de la aplicación
# se queda atado a 127.0.0.1 por el compose de la raíz, para los `curl` desde
# el propio PC, y lo único que sale a la red es el 8317. Y dos: un proxy
# delante es la MISMA forma que tendrá el despliegue de verdad, así que esta
# fase ensaya aquella en vez de inventarse otra.
#
# POR QUÉ NO AUTENTICACIÓN DENTRO DE LA APLICACIÓN
# ------------------------------------------------
# Porque en Umbrel no hará falta -el `app_proxy` la pone- y sería un segundo
# login delante del primero.
#
# CÓMO SE USA
# -----------
#   docker compose -f docker-compose.yml -f docker-compose.pruebas-lan.yml up -d
#
# Desde el móvil: http://<ip-del-pc>:8317, sin credenciales.

services:
  # El compose de la raíz monta `./data` como bind mount, y en Windows ESO NO
  # ARRANCA: SQLite abre la base en modo WAL y el bind mount de Docker Desktop
  # no soporta el bloqueo que WAL necesita. El contenedor muere en el arranque
  # con `sqlite3.OperationalError: disk I/O error` y se queda en bucle de
  # reinicio. Comprobado con las dos formas, en la misma imagen: con volumen
  # nombrado arranca sano; con el bind mount de Windows, no.
  #
  # Es un problema DE WINDOWS y solo de Windows. En Umbrel -Linux- el bind
  # mount de `${APP_DATA_DIR}/data` funciona sin más, así que este apaño no
  # viaja al destino: se queda aquí, con este fichero.
  #
  # El precio: `data/` deja de verse desde el explorador de Windows. Lo que
  # importa de ahí dentro son las copias previas a cada escritura en Hevy, que
  # son lo único que permite deshacerla. Se sacan así:
  #
  #   docker cp adaptive-training:/app/data/hevy_backups ./hevy_backups
  #   docker cp adaptive-training:/app/data/app.db ./app.db
  app:
    # Lo que convierte el aviso de arranque en informativo en vez de alarmante:
    # "sin autenticación y es deliberado" se lee distinto que "sin
    # autenticación y nadie ha dicho nada". El aviso sale igual -no hay forma de
    # silenciarlo sin poner un proxy con login de verdad-, que es el punto.
    environment:
      AUTH_FRONT: ninguna

    volumes:
      - datos-pruebas:/app/data
      - ./config.yaml:/app/config.yaml:ro

  proxy:
    # Versión fijada a propósito: con una etiqueta flotante, el día que Caddy
    # cambie algo de la sintaxis esto deja de arrancar una mañana cualquiera,
    # sin avisar antes.
    image: caddy:2.10-alpine
    container_name: adaptive-training-proxy
    restart: unless-stopped

    depends_on:
      - app

    ports:
      # A toda la red de casa, que es el objetivo, y sin contraseña detrás (ver
      # la cabecera de este fichero).
      #
      # 8317 y no 8080 por dos motivos. El bueno: es el mismo puerto que reserva
      # `umbrel/umbrel-app.yml`, así que la dirección que uno se aprende ahora
      # es la que seguirá valiendo después. El práctico: en este PC el 8080 ya
      # lo tiene cogido `hydroxide` en 127.0.0.1, y publicar encima falla.
      - "8317:8317"

    volumes:
      - ./Caddyfile.pruebas:/etc/caddy/Caddyfile:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Sobrevive a `down` y a `up`. Se borra a conciencia con
  # `docker volume rm hevy2garmin-test_datos-pruebas`, no por accidente.
  datos-pruebas:
