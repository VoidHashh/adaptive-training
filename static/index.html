<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check-in</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<!-- Safari no mira el manifest para el icono de la pantalla de inicio: mira
     esto, y en PNG. Sin esta línea, "Añadir a pantalla de inicio" en un iPhone
     guarda un recorte de la propia página como icono. -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#14161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Check-in">
</head>
<body class="con-nav">

<main id="app">
  <header class="cab">
    <h1>Check-in</h1>
    <p class="fecha" id="fecha">—</p>
  </header>

  <!--
    El estado del SISTEMA, no el del check-in. Va antes del formulario, fuera de
    él y sin esperar a que cargue, porque avisa de cosas que no se notan
    rellenándolo: sin las claves de Hevy y Telegram el formulario se envía y se
    guarda igual, y luego no se escribe la rutina ni llega el mensaje. Desde el
    móvil eso es idéntico a un día de descanso.

    `/api/health` ya devolvía `secrets_missing` y el estado del planificador
    desde el principio; lo que no había era nadie que lo leyera salvo el
    healthcheck de Docker, que solo mira que conteste 200.
  -->
  <section id="salud" hidden></section>

  <!--
    Se rellena desde `/api/checkin/today`, que devuelve los deslizadores tal y
    como están en el `config.yaml`. Aquí no hay ninguna lista de deslizadores
    escrita a mano: si la hubiera, añadir uno al YAML lo dejaría fuera del
    formulario y el sistema decidiría sin ese dato sin que nadie lo notara.
  -->
  <form id="formulario" hidden>
    <div id="deslizadores"></div>

    <label class="comentarios">
      <span id="etiqueta-comentarios">Comentarios</span>
      <textarea id="comentarios" rows="3"
                placeholder="Lo que no cabe en un número"></textarea>
    </label>

    <p class="faltan" id="faltan" hidden></p>

    <button type="submit" id="enviar" disabled>Enviar</button>
  </form>

  <!-- Mientras carga y cuando no se puede cargar. Nunca un formulario en
       blanco haciéndose pasar por uno cargado. -->
  <p class="cargando" id="cargando">Cargando…</p>

  <section id="resultado" hidden></section>

  <!--
    Los tres cables, comprobables a mano.

    Van AL FINAL y plegados a propósito. Lo que se hace todos los días es
    rellenar el formulario; esto se toca el día que algo huele mal, o la víspera
    de un día que importa. Ponerlos arriba convertiría la pantalla de todos los
    días en un panel de mantenimiento.

    El de Telegram manda un mensaje de VERDAD, y por eso lo dice el botón antes
    de pulsarlo. Un "probar" que no avisa de que tiene efecto es el tipo de
    botón que se pulsa dos veces por curiosidad.
  -->
  <section id="comprobaciones" class="comprobaciones">
    <details>
      <summary>Comprobar las conexiones</summary>
      <p class="nota">
        Sirven para el día que algo no llega. Garmin limita los intentos de
        entrada: si dice «login nuevo», conviene no insistir seguido.
      </p>
      <div class="botones-prueba">
        <button type="button" data-prueba="telegram">
          Mandarme un Telegram de prueba
        </button>
        <button type="button" data-prueba="hevy">
          Comprobar Hevy (solo lee)
        </button>
        <button type="button" data-prueba="garmin">
          Comprobar Garmin
        </button>
      </div>
      <div id="resultado-prueba" hidden></div>
    </details>
  </section>
</main>

<!--
  La barra se pinta desde `PANTALLAS` en `comun.js`, no se escribe aquí. Escrita
  a mano en los dos HTML, añadir una vista dejaría media aplicación sin enlace a
  ella, y nadie se enteraría hasta ir a buscarla.
-->
<nav id="nav" class="nav" aria-label="Secciones"></nav>

<script src="/comun.js"></script>
<script src="/app.js"></script>
</body>
</html>
