      # --- carga axial explosiva ---
      - {id: "FB09C938", name: "Snatch"}
      - {id: "E22F9358", name: "Power Snatch"}
      - {id: "F4E77594", name: "Hang Snatch"}
      - {id: "F3717B0E", name: "Dumbbell Snatch"}
      - {id: "89304423", name: "Kettlebell Snatch"}
      - {id: "ABB00838", name: "Clean"}
      - {id: "C628D768", name: "Power Clean"}
      - {id: "BD4E7E53", name: "Hang Clean"}
      - {id: "652FEA39", name: "Clean Pull"}
      - {id: "9E09CEC3", name: "Clean and Jerk"}
      - {id: "D3095577", name: "Clean and Press"}
      - {id: "F99C211D", name: "Kettlebell Clean"}
      - {id: "E764B907", name: "Split Jerk"}
      - {id: "90E506D5", name: "Thruster (Barbell)"}
      - {id: "10313AFD", name: "Thruster (Kettlebell)"}
      - {id: "542F3CD5", name: "Push Press"}
      - {id: "7B8D84E8", name: "Overhead Press (Barbell)"}
      - {id: "6AC96645", name: "Overhead Press (Dumbbell)"}
      - {id: "B09A1304", name: "Overhead Press (Smith Machine)"}
      - {id: "91AF29E0", name: "Seated Overhead Press (Barbell)"}
      - {id: "9930DF71", name: "Seated Overhead Press (Dumbbell)"}
      - {id: "F8A0FCCA", name: "Kettlebell Swing"}
