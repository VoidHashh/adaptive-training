      - {id: "937292AB", name: "Single Leg Romanian Deadlift (Dumbbell)"}

    # Bloqueo por nombre: red de seguridad para ejercicios PROPIOS, que llevan
    # un UUID largo en vez de un ID del catálogo y por tanto no pueden estar en
    # la lista de arriba. Se compara sin acentos y sin distinguir mayúsculas.
    name_patterns:
      - "sit ?up"
      - "crunch"
      - "abdominal(es)? (clasic|tradicional)"
      - "encogimiento"
      - "russian twist|giro ruso"
      - "elevacion(es)? de piernas? colgad"
      # Acotado con \b a ambos lados. La versión anterior era "v.?up", que
      # capturaba cualquier cadena con una `v` y un carácter cualquiera antes
      # de "up". Ahora solo coincide "v up", "v-up", "vup" y sus plurales.
      - "\\bv[- ]?ups?\\b"
      - "toes to bar"
      - "burpee"
      - "snatch|arrancada"
      # OJO, PATRÓN ANCHO: "clean" coincide con cualquier nombre que lo
      # contenga, no solo con las cargadas olímpicas. Se mantiene porque el
      # coste de un falso negativo aquí (una cargada entrando en un HIIT bajo
      # fatiga, con hernia L4-L5) es mucho mayor que el de un falso positivo,
      # que es un fallo al arrancar y se resuelve en un minuto. Si algún día un
      # ejercicio personalizado legítimo choca con él, la salida NO es
      # ensanchar el patrón sino añadir ese ejercicio a `allow_exceptions` con
      # su motivo escrito, que es donde queda auditable.
      - "clean|cargada"
      - "jerk|envion"
      - "thruster"
      - "push press"
      - "swing (ruso|con kettlebell)"
      - "box jump|salto al cajon"
      - "jump squat|sentadilla con salto"
      - "peso muerto|deadlift"
      - "press (militar|sobre la cabeza)|overhead press"
      - "buenos dias|good morning"

    # Excepciones explícitas: ejercicios que un patrón podría capturar por el
    # nombre pero que están revisados y aprobados. Si añades uno aquí, escribe
    # el motivo: dentro de seis meses no te acordarás.
    allow_exceptions:
      - id: "A1F47ACC"
        name: "Wall Ball"
        why: >
          Lanzamiento desde el pecho contra la pared, sin sentadilla y sin
          recorrido por encima de la cabeza. Equivale al chest pass del plan
          original. Revisado y aprobado explícitamente.


# -----------------------------------------------------------------------------
# 1. LÍNEA BASE — cómo se calculan las medias móviles de Garmin
# -----------------------------------------------------------------------------
baseline:
  window_days: 7            # ventana de la media móvil (HRV, FC reposo)
  min_days_required: 4      # días mínimos con dato para fiarse de la media.
                            # Por debajo de esto, las reglas objetivas (HRV/FC)
                            # NO disparan: arranque en frío -> se decide solo
                            # con el formulario.
  exclude_outliers: true    # descarta el máximo y el mínimo de la ventana


# -----------------------------------------------------------------------------
# 1-ter. BIENESTAR: QUÉ SE LE PIDE A GARMIN Y HASTA DÓNDE SE RELLENA
# -----------------------------------------------------------------------------
# La ventana de cada mañana la manda `baseline.window_days`. Aquí va lo otro:
# qué métricas se piden y qué se hace con los días que el sistema se perdió.
wellness:

  # Aquí estuvo `fetch_readiness`, el interruptor de Training Readiness (el
  # 0-100 propio de Garmin). Se ha quitado junto con la llamada, el campo y la
  # columna: `get_training_readiness` devuelve lista VACÍA para esta cuenta
  # todos los días, incluido ayer -sondeados -1, -2, -3 y luego -3 a -175, nueve
  # de nueve sin nada-. La calcula el RELOJ y no el servidor, y el reloj de aquí
  # no la calcula.
  #
  # Un interruptor cuya única posición útil es "apagado" no es una opción, es
  # una nota a pie de página con cara de ajuste. Si algún día hay un reloj que
  # sí la calcule, volver a ponerlo es un rato; tenerlo ahí mientras tanto es
  # una pregunta abierta que alguien tendrá que volver a cerrar.

  # Relleno hacia atrás de `daily_metrics`. Dos usos distintos, un solo motor:
  #
  #   recovery_days  Cada arranque, se miran los últimos N días y se piden los
  #                  que no tienen fila. Es el caso de las pruebas en el PC, que
  #                  no está encendido siempre: un día apagado es hoy un hueco
  #                  permanente, y un hueco permanente es indistinguible de un
  #                  día sin reloj.
  #   history_days   El backfill largo, a mano (`scripts/backfill_wellness.py`).
  #                  Cuanto más histórico tengan las vistas de concordancia y
  #                  desfase, antes dicen algo.
  #
  # Medido: HRV, FC en reposo, minutos de sueño y nota de sueño vuelven hasta
  # -175 días; body battery se acaba sobre -120. Lo que Garmin ya no sirve queda
  # como hueco explícito en la fila, nunca como cero.
  #
  # `pause_seconds` es el freno. Cuatro peticiones por día sondeado, y Garmin
  # limita por IP durante minutos cuando se pasa uno: 180 días a 2 s son unos
  # veinticinco minutos, que es exactamente el precio de no comerse un 429 a
  # mitad y tener que empezar otra vez.
  backfill:
    recovery_days: 45
    history_days: 180
    pause_seconds: 2.0

# -----------------------------------------------------------------------------
# 1-bis. UMBRALES ADAPTATIVOS
# -----------------------------------------------------------------------------
# Principio general: siempre que se pueda, un umbral se calcula contra tu propia
# distribución histórica en vez de ser una constante inventada. Cada entrada de
# aquí define un percentil móvil que las reglas pueden referenciar con la
# sintaxis `{gt_adaptive: <nombre>}`.
#
# AVISO IMPORTANTE sobre elegir el percentil: un umbral de percentil dispara,
# por construcción, el (100 - p)% de los días. p80 no significa "cuando estoy
# cargado", significa "1 día de cada 5". Medido sobre tus 180 días reales:
#     load_3d  p50=95   p80=238  p90=308  máximo=566
#     load_7d  p50=273  p80=485  p90=587  máximo=746
# Elegido p90: dispara ~1 día de cada 10. Con p80 eran 1 de cada 5, demasiado al
# sumarlo al resto de reglas ámbar.
#
# ESTA SECCIÓN ESTÁ VACÍA A PROPÓSITO, Y NO SIEMPRE LO ESTUVO
# ------------------------------------------------------------
# Tenía `load_2d_p90` y `load_7d_p90`. El primero lo leía `carga_acumulada`, que
# se ha borrado -el motivo largo está en su lápida, en `thresholds.amber`- y el
# segundo no lo leía nadie desde hacía tiempo. Un umbral que no referencia
# ninguna regla no se calcula, no falla y no se nota: se queda ahí pareciendo
# que el sistema mira algo que no mira. El validador ahora rechaza arrancar con
# uno suelto, así que esto no puede volver a pasar en silencio.
#
# La maquinaria sigue entera y con sus tests: declarar aquí un umbral y
# referenciarlo desde una regla con `{señal: {gt_adaptive: nombre}}` funciona
# igual que el primer día. Las claves que llevaba cada uno, por si vuelve:
# `metric`, `window_days`, `percentile`, `min_days_required` (sin él el
# percentil se calcula sobre ruido) e `include_zero_days` (contar los días de
# descanso como carga 0; excluirlos sube el umbral y afloja la regla).
#
# Los números del aviso de arriba son de `load_3d`, una métrica que tampoco
# existe ya. Se dejan porque ilustran lo que ilustran -qué significa elegir un
# percentil- y no porque sean los de nada que se calcule hoy.
adaptive_thresholds: {}


# -----------------------------------------------------------------------------
# 2. FORMULARIO DIARIO (PWA) — deslizadores 1..10
# -----------------------------------------------------------------------------
# El orden de esta lista es el orden en que aparecen en la PWA.
checkin_sliders:
  - key: fatigue
    label: "Cansancio general"
    hint_low: "fresco"
    hint_high: "reventado"
  - key: mood
    label: "Ánimo"
    hint_low: "bajo"
    hint_high: "alto"
  - key: upper_discomfort
    label: "Molestias tronco superior (cervicales/hombros)"
    hint_low: "ninguna"
    hint_high: "mucho dolor"
  - key: lower_discomfort
    label: "Molestias tronco inferior (lumbar)"
    hint_low: "ninguna"
    hint_high: "mucho dolor"
  - key: sleep_quality
    label: "Calidad del sueño percibida"
    hint_low: "fatal"
    hint_high: "excelente"
  - key: training_desire
    label: "Ganas de entrenar"
    hint_low: "ninguna"
    hint_high: "muchas"
  # 7º deslizador. NO estaba en el brief original: se añade porque Hevy no
  # registra RPE (comprobado: 0 de 268 series subidas lo llevaban, y el schema
  # PutRoutinesRequestSet ni siquiera tiene campo rpe). Sin este dato la regla
  # de progresión "todas las series con RPE <= 8" no se puede evaluar.
  - key: yesterday_rpe
    label: "Esfuerzo del entreno de ayer"
    hint_low: "suave"
    hint_high: "al límite"
    optional: true          # si ayer no hubo entreno, se deja en blanco

# Las dos preguntas de Sí/No, que NO son deslizadores y por eso no están en la
# lista de arriba.
#
# La diferencia no es de tipo de dato, es de PODER. Todo lo que hay en
# `checkin_sliders` puede ser leído por una regla del semáforo, por un freno de
# progresión o por el disparador de una regla especial: el `config_loader`
# valida contra esa lista, así que estar ahí es tener permiso para mover el
# color del día. Estas dos no lo tienen, y tenerlas fuera es lo que hace que ese
# permiso no se pueda dar por descuido. Si algún día una regla nombra
# `will_train`, el config no carga.
#
# Por qué no pueden tocar el semáforo: "no me apetece" y "hoy no voy" son
# decisiones, no medidas. Un sistema que pone el día en ámbar porque has dicho
# que no te apetece está dándote la razón y llamándolo fisiología, y además
# enseña a mentirle al formulario: contestas lo que quieres que salga. Los datos
# se guardan, se cuentan y se correlacionan con todo lo demás; lo que no hacen
# es decidir.
#
# `training_desire` (1-10) sigue estando arriba y sigue mandando en la regla
# `sin_ganas_y_reventado`. Conviven a propósito: la intensidad de las ganas es
# una medida de estado y sí es asunto del semáforo; el sí o el no de si vas a ir
# es una intención, y esa es asunto tuyo.
checkin_preguntas:
  - key: wants_to_train
    label: "¿Te apetece entrenar hoy?"
  # La única de las dos que cambia lo que se escribe: con un "no" el mensaje
  # deja de prescribir la sesión. No la suprime -la rutina se escribe en Hevy
  # igual, por si cambias de idea a las siete de la tarde-, deja de dártela
  # como plan del día. El motor la busca por su nombre, y `config_loader`
  # comprueba que siga aquí: si se borrara de esta lista, el motor leería una
  # señal que nadie escribe, se quedaría en `None` para siempre y el mensaje
  # volvería a prescribir todos los días sin que nada avisara.
  - key: will_train
    label: "¿Vas a entrenar hoy?"
    # `nota` la pinta el formulario debajo del enunciado, y está aquí y no
    # escrita en el JavaScript por lo mismo que la etiqueta: la pantalla no
    # sabe cuál de las preguntas es ésta ni tiene por qué saberlo.
    #
    # Lo que dice es lo que evita el malentendido caro: un "no" que se lee como
    # "cancela el día" haría que se contestara "sí" los días de duda, para no
    # perder la rutina. Y entonces el dato recogido sería el miedo a perderla,
    # no la intención.
    nota: >-
      La rutina se escribe en Hevy igual. Un «no» solo hace que el mensaje de
      hoy no te la proponga.

# -----------------------------------------------------------------------------
# 2-ter. EL SELECTOR DE SESIÓN
# -----------------------------------------------------------------------------
# Qué vas a hacer hoy. El formulario lo pre-selecciona con lo que el sistema
# propone, así que el caso normal -hacer lo que toca- es no tocar nada.
#
# PARA QUÉ SIRVE, QUE NO ES PARA MANDAR SOBRE LA ROTACIÓN
# -------------------------------------------------------
# Lo que gira el ciclo mañana es lo que se EJECUTÓ en Hevy, hoy y siempre. Esta
# respuesta no lo toca: se puede declarar el Día 2 y acabar haciendo el Día 1, y
# el que cuenta es el Día 1. Elegir aquí hace dos cosas, las dos de hoy:
#
#   1. Que la sesión que se escribe en Hevy sea la que vas a hacer, con SU
#      progresión y SUS ajustes del semáforo. Sin esto, desviarse un día
#      significaba levantar los pesos que esa rutina tuviera guardados de la
#      última vez, sin los ajustes de esta mañana.
#   2. Que quede escrito lo que dijiste al lado de lo que hiciste. De ahí sale
#      saber si uno se salta el Día 1 a menudo, que es información sobre uno
#      mismo y no se puede sacar de `workout_log` solo: ahí está lo que hiciste,
#      no lo que ibas a hacer.
#
# LOS DÍAS DEL CICLO NO SE ENUMERAN AQUÍ
# --------------------------------------
# Salen de `rotation.order`, y sus nombres de `routines.<clave>.title`. Escribir
# una segunda lista sería poder escribirla distinta: un `dia_4` añadido al ciclo
# y olvidado aquí dejaría el formulario ofreciendo tres opciones mientras el
# sistema rota entre cuatro, y el día que propusiera el Día 4 no habría forma de
# aceptarlo. Lo único que se nombra abajo es lo que NO es una rutina.
checkin_selector:
  key: chosen_session
  label: "¿Qué vas a hacer hoy?"
  # Lo que evita el malentendido, que aquí es el simétrico del de `will_train`:
  # si esto se leyera como «apúntame el entreno», elegir mal daría miedo y se
  # dejaría siempre lo propuesto. Y entonces el dato recogido sería el reparo a
  # tocar el selector, no la intención.
  nota: >-
    Lo que de verdad cuenta es lo que registres en Hevy. Esto solo sirve para
    que la rutina de hoy sea la que vas a hacer.
  # Las dos que no son fuerza. El motor las busca por estos nombres:
  #
  #   - `bici`: el día es de bici y no hay gimnasio. No prescribe fuerza, no
  #     mueve el ciclo y, desde el 26/09/2026, TAMPOCO ESCRIBE EN HEVY: la sesión
  #     del día es `bici`, sin ejercicios, y si esta mañana se había puesto una
  #     rutina con otra decisión, se deshace. No se confunde con la clasificación
  #     de salidas de la sección `cycling`, que sale de Garmin y es un hecho
  #     medido: esto es lo que declaraste a las siete de la mañana, y pueden no
  #     coincidir.
  #   - `otro`: entrenaste sin plan. Existe para que «hice algo» no tenga que
  #     contarse como «no contesté», que es donde caía antes todo lo que no fuera
  #     una de las tres rutinas.
  #
  # `otro` no cancela la escritura en Hevy, por lo mismo que un «no voy a
  # entrenar» tampoco la cancela: si acabas yendo al gimnasio, la rutina tiene
  # que estar puesta y no ser la de hace dos semanas. `bici` la cancelaba
  # igual hasta el 26/09/2026, y el día entero -Telegram, la tarjeta, Hevy-
  # giraba alrededor de un gimnasio al que habías dicho que no ibas. Con tus
  # palabras: «ese día no voy a ir al gimnasio, no es necesario contemplarlo».
  sin_fuerza:
    - key: bici
      label: "Bici"
    - key: otro
      label: "Otro"

checkin_comment:
  key: comments
  label: "Comentarios"


# -----------------------------------------------------------------------------
# 3. UMBRALES DEL SEMÁFORO
# -----------------------------------------------------------------------------
# Se evalúa ROJO primero; si no dispara ninguna, se evalúa ÁMBAR; si no, VERDE.
# Cada regla tiene nombre propio: es el que se guarda en `decisions.trigger_rule`
# y el que aparece en el mensaje de Telegram ("qué señal lo ha disparado").
# `requires` declara de qué datos depende: si falta alguno, la regla se salta y
# se anota como skipped en el log (no se asume ni bien ni mal).

thresholds:
  # UN VERDE SIN DATOS SALE ÁMBAR.
  #
  # Si al acabar las dos pasadas no ha disparado ninguna regla PERO alguna se
  # quedó sin evaluar porque el reloj todavía no había subido la noche, el día
  # no sale verde: sale ámbar, y el mensaje lo dice con esas palabras. El motivo
  # no es estadístico, es de espalda: no mirar y estar bien no pueden pintarse
  # igual, y con una hernia L4-L5 el error barato es el de más.
  #
  # El caso real es el del check-in a las 06:23, antes de que Garmin tenga la
  # noche. Ese ámbar nace PROVISIONAL: se vuelve a pedir el wellness a las
  # 07:30 (`schedule.recompute_time`), a las 09:00 y cada vez que se abre la
  # aplicación, y si ha llegado, el día se recalcula. Si de eso sale verde, el
  # mensaje lo anuncia como anulación -en negrita, debajo de la cabecera- igual
  # que ya lo anunciaba cuando el cambio iba al revés. Un día que ya consta
  # entrenado no se recalcula: ver la cabecera de `app/scheduler.py`.
  #
  # Solo cuenta lo que sube el reloj. Un verde decidido sin check-in también es
  # ciego, y a propósito NO lo promueve: ver `_verde_a_ciegas` en
  # `app/engine/rules.py`, donde está escrito por qué.
  #
  # Poniendo `false` se vuelve al comportamiento de antes. Está aquí y no
  # enterrado en el motor para que se lea en el mismo sitio que las reglas que
  # modula.
  ambar_sin_datos: true

  red:
    - name: lumbar_alto
      description: "Molestia lumbar >= 7"
      requires: [lower_discomfort]
      when: {lower_discomfort: {gte: 7}}

    - name: hrv_hundida_2d
      description: "HRV por debajo del 85% de la media de 7 días, 2 días seguidos"
      requires: [hrv, hrv_baseline]
      when: {hrv_ratio: {lt: 0.85, consecutive_days: 2}}

    # AQUÍ ESTABA `fc_reposo_disparada`, Y SE HA IDO. Léelo antes de reescribirla.
    #
    # Pedía `rhr_delta >= 7`: el pulso de reposo siete latidos por encima de la
    # media de siete días. En 186 días con dato -181 con pulso medible- disparó
    # CERO veces. No "pocas": cero.
    #
    # No es mala suerte, es aritmética. El `rhr_delta` más alto de todo el
    # histórico es +4,60, y el percentil 99 anda por +4. Mi pulso de reposo no
    # se mueve siete latidos; para que esta regla disparase una sola vez haría
    # falta algo que no ha pasado en medio año. Era una condición copiada de un
    # umbral genérico, no medida sobre mí.
    #
    # Una regla que no puede disparar no es "una red de seguridad por si acaso":
    # es una línea que se lee, se evalúa cada mañana y siempre dice que no,
    # dando la impresión de que el pulso está vigilado cuando no lo está. Si
    # algún día hace falta un rojo por pulso, el umbral hay que sacarlo de mi
    # distribución -p99 + algo-, no de un número redondo.
    #
    # Se fue junto con `fc_reposo_elevada`, que está en el bloque ámbar de abajo
    # y tiene su propia lápida con el motivo, que es distinto y más interesante.

    - name: sueno_muy_corto
      description: "Menos de 5 h de sueño"
      requires: [sleep_min]
      when: {sleep_min: {lt: 300}}

    - name: sin_ganas_y_reventado
      description: "Ganas <= 2 y cansancio >= 8"
      requires: [training_desire, fatigue]
      when:
        all:
          - {training_desire: {lte: 2}}
          - {fatigue: {gte: 8}}

  amber:
    - name: lumbar_medio
      description: "Molestia lumbar entre 5 y 6"
      requires: [lower_discomfort]
      when: {lower_discomfort: {gte: 5, lte: 6}}

    - name: cervicales_hombros
      description: "Molestia tronco superior >= 6"
      requires: [upper_discomfort]
      when: {upper_discomfort: {gte: 6}}

    - name: hrv_baja_1d
      description: "HRV por debajo del 90% de la media de 7 días"
      requires: [hrv, hrv_baseline]
      when: {hrv_ratio: {lt: 0.90}}

    # AQUÍ ESTABA `fc_reposo_elevada`, Y SE HA IDO. Léelo antes de reescribirla.
    #
    # Pedía `rhr_delta >= 4`. Y OJO, porque esta no murió por no ver nada: el
    # pulso de reposo SÍ distingue. Sobre 186 días, con una tasa de fondo de
    # 22,1 % de días con `hrv_ratio < 0,90`:
    #
    #     >= 2,0 lpm   40 disparos   26/40 (65 %)   p = 0,0000
    #     >= 3,0 lpm   27 disparos   17/27 (63 %)   p = 0,0000
    #     >= 4,0 lpm    6 disparos    4/6  (67 %)   p = 0,0243
    #
    # Murió por la segunda pregunta, que es la que importa: ¿cuántos días PINTA
    # ELLA? Con el umbral que tenía, uno. Uno en 186 días:
    #
    #     2026-08-05   rhr_delta +4,60 · hrv_ratio 0,936 · ninguna otra regla
    #
    # Los otros cinco disparos venían todos acompañados de `hrv_baja_1d` o de
    # `sueno_corto`, que ya habían puesto el día en ámbar por su cuenta. Y bajar
    # el umbral no lo arregla: a >= 2,0 lpm pinta 9 días ella sola, a >= 3,0
    # pinta 6, a >= 3,5 pinta 2. En NINGÚN umbral hay un solo día propio con el
    # cuerpo bajo.
    #
    # Ese último "ninguno" hay que leerlo con cuidado, porque no es un hallazgo:
    # un día propio es, por definición, un día en que `hrv_baja_1d` no disparó,
    # y `hrv_baja_1d` ES `hrv_ratio < 0,90`, que es el criterio. O sea que un
    # día propio NO PUEDE tener el cuerpo bajo. La cuenta que sí dice algo es la
    # otra: los 6 o 9 días que recorta ella sola, y que son días con la HRV
    # normal. Eso son sesiones perdidas.
    #
    # El resumen es que `rhr_delta` es un buen TERMÓMETRO y un mal INTERRUPTOR:
    # sube cuando el cuerpo está mal, pero nunca antes ni en lugar de la HRV, y
    # cuando habla solo es porque se ha equivocado. Sigue siendo una señal viva
    # -se calcula, se guarda, se pinta en el panel y se puede mirar-; lo que se
    # ha ido es su voto.
    #
    # Se fue con `fc_reposo_disparada`, que está arriba en el bloque rojo y que
    # no llegó a disparar ni una vez en todo el histórico.

    # AQUÍ ESTABA `sueno_corto`, Y SE HA IDO. Es la que más costó matar.
    #
    # Pedía `300 <= sleep_min < 390`: entre 5 h y 6,5 h de sueño. Era la regla
    # más ruidosa del sistema con diferencia -58 disparos en 186 días, y el
    # color lo pintaba ella sola 44 veces: 44 de mis 79 ámbares- así que antes
    # de borrarla se agotaron las cuatro alternativas, una por una, replicando
    # los 186 días mañana a mañana con el motor de verdad. Criterio: el cuerpo
    # bajo esa misma mañana (`hrv_ratio < 0,90`), que de fondo pasa el 22,1 %
    # de los días (40 de 181 medibles). 53 variantes, Benjamini-Hochberg
    # aplicado UNA sola vez sobre todas juntas.
    #
    # 1. MÁS O MENOS MINUTOS. Barrido del corte de 300 a 420.
    #    Nada. El mejor es el propio tramo ancho: 21/91 = 23 % contra 22,1 %
    #    de fondo, q = 0,8279. Y el barrido sube MONÓTONAMENTE con más sueño,
    #    o sea en la dirección contraria a la que la regla supone.
    #
    # 2. LA NOTA EN VEZ DE LOS MINUTOS. Esto SÍ distingue, y fuerte:
    #
    #        sleep_score < 65     7 disparos    6/7  (86 %)   q = 0,0079
    #        sleep_score < 70    11 disparos    8/11 (73 %)   q = 0,0079
    #        sleep_score < 75    30 disparos   15/30 (50 %)   q = 0,0079
    #        sleep_score < 80    65 disparos   27/65 (42 %)   q = 0,0079
    #
    # 3. POCAS HORAS **Y** MALA NOTA. Nada pasa el corte. Cruzar los minutos
    #    con la nota EMPEORA la nota sola: los minutos solo añaden ruido.
    #
    # 4. DOS NOCHES CORTAS SEGUIDAS. Nada. Solo encoge la muestra.
    #
    # Y LA PRUEBA QUE DECIDE, QUE ES LA DE ANTICIPACIÓN. Un ámbar sirve para
    # avisar de algo que todavía no se sabe; si solo repite lo que otra regla
    # ya dijo, no informa: recorta. Así que se repitieron las 53 variantes
    # SOLO sobre los días en que `hrv_baja_1d` no avisa (fondo condicionado
    # 27/140 = 19,3 %):
    #
    #     NINGUNA de las 53 gana al fondo. Todas q = 1,0000.
    #     `sleep_score < 70`, la mejor de todas arriba, acierta 0 de 3.
    #
    # O sea: la variante que distingue solo repite lo que la HRV ya había
    # dicho, y en los días en que la HRV dice lo contrario no acierta nunca.
    # No es una señal adelantada, es un eco. Y un eco que costaba 44 sesiones
    # recortadas en 186 días.
    #
    # `sueno_muy_corto` (< 5 h) SE QUEDA, y no por inconsistencia: es ROJA, no
    # ámbar, disparó 1 vez en 186 días y esa vez pintó el día. Es una barrera
    # para la noche catastrófica, no un termómetro diario.
    #
    # La señal sigue viva: `sleep_min` y `sleep_score` se leen, se guardan, se
    # pintan en el panel y `trend` los usa como cualificador del aviso. Lo que
    # se ha ido es su voto.

    - name: cansancio_alto
      description: "Cansancio >= 7"
      requires: [fatigue]
      when: {fatigue: {gte: 7}}

    # AQUÍ ESTABA `carga_acumulada`, Y SE HA IDO. Léelo antes de reescribirla.
    #
    # Ponía el día en ámbar cuando la carga de bici de ayer y anteayer pasaba tu
    # percentil 90 habitual. La pregunta que se hizo antes de borrarla no fue
    # "¿qué ventana?" sino "¿debe existir?", y la respuesta salió de replicar los
    # 185 días mañana a mañana con el motor de verdad, con el sesgo de la ventana
    # ya arreglado, preguntando cuántas de las veces que disparaba el cuerpo
    # estaba de verdad bajo esa misma mañana (hrv_ratio < 0,90; de fondo pasa el
    # 22,2 % de los días):
    #
    #     k=1  ayer solo            16 disparos   10/16   p = 0,0006   pasa BH
    #     k=2  ayer y anteayer      18 disparos    6/18   p = 0,19     no pasa
    #     k=3  los tres de antes    22 disparos    6/22   p = 0,36     no pasa
    #
    # El k=1 es el único que pasa el corte, y aun así no se salva: de sus 16
    # disparos solo 2 días serían VERDES sin ella, y los dos con el cuerpo normal
    # (hrv_ratio 1,067 y 0,905). Toda su significación sale de días que
    # `hrv_baja_1d` y `hrv_hundida_2d` ya cogen por su cuenta. Con k=2 son 5 días
    # propios, los cinco con el cuerpo bien. Sea cual sea la ventana, LO QUE ESTA
    # REGLA AÑADE POR SU CUENTA SON FALSAS ALARMAS, y un ámbar gastado es una
    # sesión recortada de verdad.
    #
    # Es el mismo caso que `resaca_finde`, que está aquí abajo: una regla que
    # dispara contando actividades en vez de midiendo el cuerpo. Cuando el cuerpo
    # y el calendario no coinciden, manda el cuerpo, y el cuerpo ya tiene cuatro
    # reglas propias.
    #
    # Con ella se fueron `adaptive_thresholds.load_2d_p90` y `load_7d_p90`, que
    # no los leía ningún sitio más. La maquinaria de percentiles sigue entera y
    # con sus tests (`resolve_adaptive_threshold` en `app/engine/signals.py`, la
    # sintaxis `{señal: {gt_adaptive: nombre}}`): declarar un umbral nuevo ahí y
    # referenciarlo desde una regla vuelve a encenderla. Lo que no vuelve solo es
    # el motivo para hacerlo.
    #
    # Las señales `load_2d` y `load_7d` NO se han ido: las siguen usando el
    # consejero de bici y la recalibración.

    # AQUÍ ESTABA `resaca_finde`, Y SE HA IDO. Léelo antes de reescribirla.
    #
    # Ponía el lunes en ámbar si el fin de semana había sumado más de 2,5 h de
    # bici o alguna salida intensa. Era la única de las trece reglas de esta
    # sección que disparaba contando actividades en vez de midiendo el cuerpo, y
    # la única de los frenos por cuenta que llegaba hasta la sesión de fuerza:
    # ámbar el lunes es -25 % de series, sin progresión y sin HIIT.
    #
    # Sobre 180 días reales -26 lunes- disparaba en 10 y era la ÚNICA causa del
    # ámbar en 2:
    #
    #   2026-04-06   9,06 h de bici · 0 salidas intensas
    #                load_3d 188 contra un p90 propio de 255
    #                hrv_ratio 1,62 · rhr_delta -4,4
    #   2026-06-01   6,43 h de bici · 0 salidas intensas
    #                load_3d 107 contra un p90 propio de 389
    #                hrv_ratio 0,98 · rhr_delta +0,4
    #
    # Los dos por la rama de las horas, y los dos con el cuerpo diciendo lo
    # contrario: HRV alta, pulso de reposo por debajo de la media, carga muy por
    # debajo de la propia distribución. Horas de bici no son fatiga; son horas de
    # bici.
    #
    # Cuando se borró, el argumento fue "lo que mide esto de verdad es
    # `carga_acumulada`, que compara contra tu propia distribución". Ese relevo
    # ya no existe: `carga_acumulada` se ha ido también, y por el mismo motivo de
    # fondo. Medir la carga contra el propio histórico era mejor que medirla
    # contra un número escrito a mano, pero las dos seguían contando actividades,
    # y el cuerpo -HRV, pulso de reposo, sueño- ya tiene sus cuatro reglas y
    # acierta más.
    #
    # Si algún día vuelve la tentación de frenar el lunes, que no sea contando
    # horas: eso es un calendario hablando, y encima uno que hay que recalibrar a
    # mano cada vez que cambia el volumen -lo decía su propio comentario, que
    # empezaba por "RECALIBRAR".


# -----------------------------------------------------------------------------
# 4. ACCIONES POR SEMÁFORO
# -----------------------------------------------------------------------------
actions:
  # Aquí había un `allow_hiit` por luz. Se fue el 26/09/2026 con los bloques
  # HIIT aparte: los intervalos van ahora dentro de cada rutina y siguen la luz
  # como el resto de ejercicios. Ver `hiit`.
  green:
    session: full
    allow_progression: true
    bike_max: intensa       # techo de intensidad para la bici; ver `cycling`

  amber:
    session: reduced
    set_reduction: 0.25       # -25% de series, redondeando hacia abajo
    min_sets_per_exercise: 2
    drop_expendable: true     # elimina los ejercicios marcados
                              # expendable_in_amber: true
    allow_progression: false
    bike_max: suave

  red:
    session: recovery
    allow_progression: false
    bike_max: descanso
    # Aquí vivían `defer_strength: true` y `defer_expires_days: 7`. Un rojo
    # guardaba la sesión de fuerza en una tabla y la reponía en el primer día
    # verde libre, y si no llegaba en siete días se perdía. Con la rotación
    # leída de lo ejecutado (ver `rotation`) eso sobra entero: un día rojo no
    # ejecuta ninguna rutina del ciclo, luego el puntero no se mueve y mañana
    # vuelve a tocar exactamente la misma. No hay nada que aplazar ni que
    # caducar, y por tanto tampoco una sesión que se pueda perder por caducidad.
    recovery_block: recuperacion_suave   # ver `recovery_blocks` abajo


# -----------------------------------------------------------------------------
# 5. PROGRESIÓN DE CARGAS
# -----------------------------------------------------------------------------
progression:
  # Puerta de entrada (todo debe cumplirse):
  #  (a) semáforo VERDE hoy
  #  (b) en su última ejecución se completaron TODAS las series con las reps
  #      objetivo. «Su» es de cada EJERCICIO desde el 25/09/2026
  #      (`compliance_scope: exercise`): con `routine`, un ejercicio incompleto
  #      frenaba la subida de toda la rutina, y en las diez primeras decisiones
  #      la puerta no se abrió ni una vez. Ahora un 12/12/9 deja ese ejercicio
  #      en 12/12/12 y no a los demás.
  #  (c) los dos frenos de abajo no están activos
  # (a) y (c) siguen siendo de la rutina entera: el semáforo y la lumbar hablan
  # del día, no de un ejercicio.
  gate:
    require_green: true
    require_all_sets_at_target_reps: true
    compliance_scope: exercise

  # `on_missing` dice qué hacer cuando la señal de un freno no está disponible:
  #   block (por defecto) -> se cierra la puerta y se explica por qué
  #   skip                -> el freno se ignora ese día
  # El defecto es `block` a propósito: un freno que no se puede evaluar no es
  # un freno que no salta. Cada `skip` es una excepción consciente y se
  # justifica aquí al lado.
  brakes:
    # Freno 1: si el esfuerzo percibido del entreno fue alto, no se sube.
    - name: rpe_alto
      source: yesterday_rpe
      when: {gte: 8}
      blocks: last_session_only    # solo bloquea la rutina de esa sesión
      # Este SÍ se salta si falta: el RPE de ayer es legítimamente nulo cuando
      # ayer no se entrenó, que es la mitad de los días. Con `block` la
      # progresión no avanzaría jamás.
      on_missing: skip

    # Freno 2: la lumbar manda. Con hernia L4-L5, cualquier molestia apreciable
    # congela TODA la progresión, no solo la de la cadena posterior.
    - name: lumbar_bloquea_todo
      source: lower_discomfort
      when: {gte: 4}
      blocks: all
      # Sin `on_missing`, es decir `block`: un día sin check-in es un día sin
      # saber cómo está la lumbar, y ese no es día de subir carga.

  # Sesiones limpias consecutivas necesarias antes de subir peso.
  # Por defecto 1. La cadena posterior necesita 2 por la hernia: se marca
  # ejercicio a ejercicio con `clean_sessions_required` más abajo.
  default_clean_sessions_required: 1

  # Incremento por defecto si el ejercicio no define el suyo.
  default_increment_kg: 2.5

  # A qué series se aplica la subida en los esquemas en rampa.
  # top_set = solo la serie más pesada | all_sets = a todas
  default_apply_to: top_set

  # ---------------------------------------------------------------------------
  # MODOS DE PROGRESIÓN
  # ---------------------------------------------------------------------------
  # Progresar solo por carga tiene tres agujeros:
  #   - los ejercicios sin peso (planchas, perro de caza, dead bug, bosu) no
  #     pueden progresar NUNCA: no hay nada que subir
  #   - la carga se agota; llega un punto en que 2,5 kg más no es una subida
  #     razonable y el estímulo se queda plano
  #   - con la hernia L4-L5, en cadena posterior una serie más es más segura
  #     que 5 kg más, y ese orden de preferencia tiene que estar en el config,
  #     no en la cabeza de nadie
  #
  # `progression_type` se declara por ejercicio. Modos:
  #
  #   load    sube CARGA cuando se cumple la puerta. El comportamiento clásico.
  #
  #   double  DOBLE PROGRESIÓN. Requiere `rep_range: [min, max]`. Mientras no se
  #           llegue al máximo en TODAS las series efectivas, sube reps. Cuando
  #           todas están en el máximo, sube carga y vuelve al mínimo. Es el
  #           modo por defecto en cualquier ejercicio con rango (10-12, 12-15).
  #
  #   volume  SIN CARGA. Sube reps o segundos según el incremento, hasta el
  #           techo. Para planchas, perro de caza, dead bug y bosu.
  #
  #   sets    Añade una SERIE EFECTIVA cuando se cumple la puerta N veces
  #           seguidas, hasta `max_sets`. Al llegar al techo pasa al modo
  #           `then` (por defecto `double`). Modo preferente en cadena
  #           posterior: primero series, después carga.
  default_progression_type: double

  modes:
    double:
      # Si el ejercicio no declara `rep_range`, se deduce del propio esquema:
      # min = reps actuales de la serie más baja, max = min + `deduced_span`.
      # Deducir es peor que declarar; el YAML lo declara donde importa.
      deduced_span: 3
      rep_increment: 1
      # A qué series se suben las reps:
      #   lowest_first -> UNA serie, la más baja. 12/10/10 -> 12/11/10, y en
      #                   las sesiones siguientes 12/11/11, 12/12/11, 12/12/12.
      #                   Se llena desde abajo y la rampa se conserva.
      #   all_sets     -> todas a la vez, cada una topada en el máximo del rango.
      # Ninguno de los dos baja nunca una serie. El código llegó a hacerlo: esta
      # opción no se leía y escribía un valor absoluto en todas las series, así
      # que 12/10/10 salía 11/11/11, aplanado Y con una repetición MENOS arriba.
      rep_apply_to: lowest_first

    volume:
      reps_increment: 2
      seconds_increment: 5
      # Aquí `all_sets`, y la diferencia con la doble progresión es deliberada:
      # esto son planchas y core, esquemas parejos (3×20) sin rampa que
      # preservar. Subir de una en una triplicaría lo que tarda en avanzar el
      # modo que existe precisamente para progresar sin tocar la carga.
      rep_apply_to: all_sets
      # Techos por defecto. Pasado esto un ejercicio de core deja de ser core y
      # empieza a ser resistencia: si se llega aquí, toca cambiar el ejercicio
      # o añadir carga, y el sistema avisa en vez de seguir sumando.
      max_reps: 30
      max_seconds: 60
      on_ceiling_notify: true

    sets:
      # Más exigente que la subida de carga a propósito: una serie efectiva más
      # es un salto de volumen mayor que 2,5 kg.
      clean_sessions_required: 3
      max_sets: 5               # SERIES EFECTIVAS, sin contar el calentamiento
      # Modo al que se pasa cuando ya se ha llegado a `max_sets`.
      then: double

  # ---------------------------------------------------------------------------
  # SEGURIDAD DE LA PROGRESIÓN DE VOLUMEN
  # ---------------------------------------------------------------------------
  # La carga que subes se nota el mismo día. El volumen se acumula y se nota
  # tres semanas después, cuando ya no sabes de dónde viene. Por eso el volumen
  # lleva frenos propios, además de la puerta general.
  volume_safety:
    enabled: true

    # ---- DOS PUERTAS, NO UNA ----------------------------------------------
    # Añadir una SERIE y añadir REPS no tienen el mismo riesgo, así que no
    # pasan por la misma puerta. Una cuarta serie de hip thrust es una dosis
    # nueva de trabajo con carga sobre la cadena posterior; dos repeticiones
    # más de dead bug no lo son. Con las dos cosas en el mismo freno había que
    # elegir entre ser laxo con la serie o asfixiar las reps, y se asfixiaban
    # las dos.
    #
    # POR QUÉ SE MIDE POR SESIÓN Y NO POR DÍAS
    # La versión anterior usaba una ventana de 7 días: "ningún rojo y menos de
    # dos ámbar en la última semana". Eso medía en días algo que ocurre una vez
    # por semana en cada rutina, y el desajuste de relojes salía carísimo: un
    # rojo en lunes cancelaba la única oportunidad de volumen de las TRES
    # rutinas, porque las tres caen dentro de esos 7 días. En una simulación de
    # 12 semanas con 7% de días rojos la puerta quedaba abierta solo el 25% de
    # los días verdes, y la cadena posterior (hip thrust, curl femoral, peso
    # muerto) no subía UNA sola serie en todo el trimestre. Los ejercicios de
    # carga no lo notaban porque tienen otro canal por el que progresar; los de
    # volumen no tienen otro. El freno acababa castigando justo a los
    # ejercicios que la hernia L4-L5 obliga a favorecer, que es lo contrario de
    # para lo que se puso.
    #
    # Anclado a la sesión anterior de LA MISMA rutina, el freno responde a lo
    # que de verdad importa: cómo fue la última vez que se hizo este trabajo.

    # Puerta ESTRICTA: añadir una serie efectiva (modo `sets`).
    sets_gate:
      # Estados de la sesión anterior de ESTA rutina que bloquean.
      block_if_last_routine_session_in: [red, amber]
      block_if_mean_lower_discomfort_gte: 4

    # Puerta RELAJADA: subir reps o segundos (modo `volume`, y la fase de reps
    # del modo `double`). Solo la para un rojo o una lumbar sostenida alta.
    reps_gate:
      block_if_last_routine_session_in: [red]
      block_if_mean_lower_discomfort_gte: 5

    # Ventana de la media lumbar. La molestia sí es una señal diaria, así que
    # esta se sigue midiendo en días.
    #
    # OJO: si esta ventana sale VACÍA -ningún check-in en esos días- las dos
    # puertas CIERRAN, no pasan. Es la misma regla que el bucle de `brakes`
    # aplica a cualquier señal que falte: no saber cómo está la lumbar no es
    # lo mismo que saber que está bien, y con una L4-L5 la puerta que decide
    # si se añade una serie a la cadena posterior no puede abrirse a ciegas.
    # Se desbloquea rellenando el check-in, y el motivo que se guarda en la
    # decisión lo dice con esas palabras.
    discomfort_lookback_days: 7

    # Si nunca se ha hecho esta rutina no hay sesión anterior con la que
    # comparar. `true` deja pasar: la alternativa es que un programa recién
    # estrenado no progrese nunca.
    allow_if_no_previous_session: true

    # Ámbito del estado que se arrastra (racha limpia y turno de espera):
    #   routine_exercise -> por rutina Y ejercicio
    #   exercise         -> por ejercicio, compartido entre rutinas
    #
    # `routine_exercise` es el correcto: `plancha_lateral` está en las tres
    # rutinas con dosis distintas (20 s en Día 1, 30 s en Día 2), y `dead_bug`
    # y `perro_de_caza` en dos. Compartiendo racha acumularían sesiones limpias
    # de tres rutinas y progresarían al triple de velocidad de la que se
    # entrenan.
    state_scope: routine_exercise

    # Nunca las dos cosas el mismo día.
    never_load_and_volume_same_session: true

    # Ámbito del conflicto:
    #   exercise -> un mismo ejercicio no sube carga y volumen a la vez
    #   session  -> en toda la sesión se sube una cosa o la otra (más estricto)
    #
    # `exercise` es el ámbito correcto: lo peligroso es subir carga Y volumen
    # en EL MISMO ejercicio (3→4 series y 60→62,5 kg a la vez es un +35% de
    # trabajo en ese ejercicio, y cuando la semana siguiente venga mal no hay
    # forma de saber cuál de las dos sobró). Que la prensa suba peso el mismo
    # día que el perro de caza suma repeticiones no tiene ese riesgo: son
    # estímulos distintos en músculos distintos.
    #
    # Con `session` aparecía además un efecto de inanición: los ejercicios en
    # modo `double` ya al tope de su rango piden carga TODAS las sesiones, así
    # que con `prefer: load` la cadena posterior en modo `sets` no subía una
    # serie jamás, y con `prefer: volume` el Día 3 tardaba 14 sesiones en
    # volver a tocar el peso. Ninguna de las dos cosas es lo que se quiere.
    conflict_scope: exercise

    # Quién gana el conflicto DENTRO de un mismo ejercicio. `volume` es la
    # prioridad clínica declarada: con la hernia, una serie más antes que
    # 5 kg más.
    prefer_on_conflict: volume

    # ---- Cupos por sesión ----
    # Con `conflict_scope: exercise` desaparece el freno natural que suponía
    # "una sola clase de progresión por sesión", así que los cupos pasan a ser
    # lo único que evita que un día bueno dispare siete subidas a la vez. Un
    # salto semanal así de grande y de golpe es exactamente lo que no conviene
    # a una espalda con L4-L5: mejor escalonado.
    max_volume_increases_per_session: 2
    max_load_increases_per_session: 3

    # Cuando hay más candidatos que cupo, ¿quién pasa primero?
    #   waiting_longest -> el que lleva más sesiones sin progresar
    #   routine_order   -> el orden en que están escritos en la rutina
    #
    # `waiting_longest` importa más de lo que parece: con `routine_order`, en
    # una rutina larga como el Día 3 los últimos no llegarían a subir NUNCA,
    # porque los de arriba agotan el cupo cada sesión. Turnándose, todos acaban
    # pasando.
    #
    # El 18-09-2026 el Día 3 pasó de 11 ejercicios a 15, y con eso las dos colas
    # quedan así: VOLUMEN 6 candidatos (4 de core + el rumano y la extensión de
    # espalda, que están en modo `sets` y una serie más cuenta como volumen)
    # para un cupo de 2; CARGA 9 candidatos para un cupo de 3. O sea tres
    # sesiones de Día 3 para dar una vuelta completa a cada cola, donde antes
    # eran dos. Nada se rompe -para eso está `waiting_longest`-, pero cada
    # ejercicio concreto tarda una sesión más en volver a tocarle el turno, y
    # eso es una decisión, no un efecto secundario: si se quiere la cadencia de
    # antes hay que subir los cupos, sabiendo que eso es lo que este bloque
    # existe para no hacer a la ligera.
    queue_policy: waiting_longest

  # ---------------------------------------------------------------------------
  # ADOPTAR LA CARGA QUE DE VERDAD SE LEVANTÓ
  # ---------------------------------------------------------------------------
  # El motor manda la carga: la calcula, la escribe en Hevy y la guarda. Pero
  # quien levanta el peso es uno, y a veces no coincide:
  #
  #   - La máquina no tiene el disco de 2,5 y se hace con 5 más.
  #   - 60 salió fácil y se subió a 65 a mano.
  #   - El banco estaba ocupado y se hizo la serie con lo que había.
  #
  # Hasta este bloque, el sistema no leía nunca el peso ejecutado, y eso rompía
  # por los dos lados. Hacia arriba, el mensaje anunciaba "60→62,5" a alguien que
  # ya estaba en 65: un mensaje que no describe la realidad se deja de leer.
  # Hacia abajo era peor, porque además era silencioso: el cumplimiento solo
  # miraba REPS, así que una sesión hecha a 50 con el plan en 60 salía LIMPIA y
  # pagaba la siguiente subida. El plan se iba a 62,5 mientras la realidad se
  # quedaba en 50, separándose un poco más cada semana. Ahora el peso cuenta para
  # el cumplimiento, y lo que se levanta se adopta.
  #
  # LA ASIMETRÍA ES EL MECANISMO, no un ajuste fino:
  #
  #   Subir se mide contra el OBJETIVO VIGENTE y se adopta a la PRIMERA. La
  #   prueba es directa -se levantó, y con las reps completas-.
  #
  #   Bajar se mide contra LO QUE SE PIDIÓ HOY (el plan ya recortado por la
  #   descarga, las reglas y el ámbar) y necesita varias sesiones seguidas. Una
  #   sesión más floja casi siempre es el gimnasio lleno o una serie mal
  #   apuntada, y bajar el objetivo por eso es la forma silenciosa de que un
  #   programa se desinfle. Medir la bajada contra el objetivo vigente, y no
  #   contra el plan del día, convertiría cada semana de descarga bien hecha en
  #   tres sesiones "por debajo".
  adopt_executed_load:
    enabled: true

    # Sesiones SEGUIDAS por debajo de lo pedido antes de bajar el objetivo.
    # Cuando por fin se baja, se baja a la MEJOR de ellas: un día malo no fija
    # el suelo. Tres es una semana y media de esa rutina; con 1 cualquier día
    # torcido movería el programa, y con 5 el desfase duraría más de un mes.
    down_after_sessions: 3

    # Tope del salto que se adopta de una vez, para que un 600 en vez de un 60 al
    # teclear en Hevy no se convierta en la rutina de mañana. Los dos son Y: vale
    # el MENOR de los dos, no el mayor.
    #
    # ENSANCHADOS EL 25/09/2026, de 5 kg y 20% a 30 kg y 60%, y el motivo es que
    # estaban frenando la realidad y no las erratas. En seis meses el tope actuó
    # CUATRO veces y las cuatro eran levantamientos de verdad:
    #
    #     patada atrás      35 -> 50    (+15)
    #     extensión cuád.   40 -> 60    (+20)
    #     aducción cadera   50 -> 60    (+10)
    #     contractora       30 -> 37,5  (+7,5)
    #
    # Cero erratas. Un tope que solo ha frenado aciertos no está protegiendo
    # nada: está obligando a fijar a mano lo que el sistema ya sabía. Con 30 y
    # 60% los cuatro pasan con margen y los dedazos de verdad -los que meten un
    # dígito de más- siguen frenados: 60->600 pide 540, 50->150 pide 100, y el
    # tope más ancho que existe es 30.
    #
    # La decisión de fondo es del usuario y está escrita para que no se relea
    # como un descuido: el sistema aconseja, no decide. Lo que se levanta es lo
    # que hay, y el tope se queda solo para lo que no se puede haber levantado.
    #
    # Estaba en el mayor, y así el tope se AFLOJABA justo donde la carga absoluta
    # es mayor: con un objetivo de 150 kg el margen salía 30, de modo que un
    # dedazo de 150 a 180 entraba sin que nadie lo mirara. Con una L4-L5 eso es
    # el sentido contrario del que tiene que tener un tope. En Y, "nunca más de
    # 5 kg de golpe" significa eso, y el porcentaje solo puede APRETAR más en los
    # ejercicios ligeros.
    #
    # El suelo es el `increment_kg` del propio ejercicio, y no se configura aquí
    # porque no es una política sino una contradicción que hay que evitar: sin
    # ese suelo, un ejercicio de 10 kg con incremento 2,5 tendría un margen de 2
    # y su propia subida normal saldría rechazada como si fuera una errata.
    #
    # Pasarse del tope NO adopta y NO calla: sale en el mensaje de la mañana
    # siguiente con el motivo, y con el modo de fijarlo a mano si era real
    # (`scripts/fijar_carga.py`, que escribe en `exercise_targets`, que es lo que
    # manda; este fichero solo es el punto de partida).
    max_jump_kg: 30
    max_jump_pct: 0.60

  # En semana de descarga el volumen también baja. `special_rules` recorta la
  # carga al 60%; sin esto el volumen se quedaba intacto y la descarga era
  # media descarga.
  deload:
    reduce_volume: true
    sets_factor: 0.70         # series efectivas, redondeando hacia abajo, mín. 2
    reps_factor: 0.80
    seconds_factor: 0.80
    freeze_progression: true  # durante la descarga no se progresa nada


# -----------------------------------------------------------------------------
# 5-bis. SERIES DE CALENTAMIENTO
# -----------------------------------------------------------------------------
# Donde hay 4 series, la primera es de calentamiento con poco peso. No es una
# serie efectiva, así que queda FUERA de:
#   - el cumplimiento que abre la puerta de la progresión (solo cuentan las
#     efectivas: calentar con 30 kg no demuestra nada sobre si toca subir)
#   - el cálculo de volumen
#   - el recorte del -25% de los días ÁMBAR, que se aplica sobre las efectivas
# Y además nunca se elimina: el día que vienes tocado, calentar importa más, no
# menos.
#
# ESTADO REAL (releído de la API el 18-09-2026): las series de calentamiento
# están MARCADAS en Hevy. Son las primeras series de los 20 ejercicios de 4
# series: 5 en Día 1, 6 en Día 2 y 9 en Día 3. Eran 18 hasta que el Día 3 ganó
# cuatro ejercicios ese día, de los cuales dos -el peso muerto rumano y el
# jalón de brazos rectos- traen su calentamiento marcado desde la app.
#
# Es decir: hoy manda la API y la heurística no llega a ejecutarse nunca. Se
# mantiene como plan B por dos motivos concretos, no por simetría:
#   - un ejercicio nuevo añadido en Hevy con prisa y sin marcar la serie
#   - una rutina creada desde cero, donde es fácil olvidarlo
# En ambos casos la heurística cubre el hueco sin que el sistema tenga que
# decidir a ciegas.
#
# La precedencia es por EJERCICIO, no por rutina: basta con que un ejercicio
# tenga alguna serie marcada para que se crea su marcado entero. Así, marcar
# uno solo no altera el comportamiento de los demás.
set_types:

  # api                -> manda el campo `type` de Hevy y punto
  # heuristic          -> se ignora la API y se aplica siempre la regla de abajo
  # api_then_heuristic -> manda la API; si no marca ninguna, se aplica la regla
  source: api_then_heuristic

  heuristic:
    enabled: true
    # "La primera serie de un ejercicio con N o más series es calentamiento".
    sets_gte: 4
    count: 1                  # cuántas series iniciales cuentan como calentamiento

  # Excepciones por ejercicio, con la clave interna (no el nombre). Un `false`
  # desactiva la heurística ahí y trata las cuatro series como efectivas.
  # Vacío a propósito: con las series ya marcadas en Hevy no hace falta ninguna
  # excepción. (El caso que lo motivaba, `gemelo_sentado`, se corrigió en la
  # propia rutina, que hoy es 10x40 de calentamiento y 60/65/70 de trabajo. Este
  # comentario llegó a decir «30/40/50» bastante después de que dejara de ser
  # verdad; los números concretos de un ejercicio se miran en su `sets`, unas
  # setecientas líneas más abajo, y no aquí.)
  # Un override NO ignora un marcado explícito de Hevy: solo desactiva la
  # heurística para ese ejercicio.
  overrides: {}

  exclude_from:
    progression_compliance: true
    volume: true
    amber_set_reduction: true
  never_drop_warmup: true

  # Al reescribir la rutina, las series que el motor DECIDE que son
  # calentamiento salen del PUT marcadas como `warmup`. Así quedan marcadas en
  # la app y la próxima lectura las trae ya con el dato: la rama `api` de
  # `source` resuelve sola y se deja de depender de la heurística de "la
  # primera de cuatro", que es una suposición sobre la rutina y no un dato.
  #
  # Estuvo en `false` y el código escribía el `type` de todas formas, así que la
  # opción no decidía nada. Lo que gobierna ahora es concretamente esto: la
  # marca que AÑADE el sistema por su cuenta (hoy, la de la heurística).
  #
  # Lo que NO hace, ni en `false`: quitar marcas. Una serie que ya venga como
  # `warmup`, `dropset` o `failure` se reproduce tal cual, igual que el
  # `superset_id`. Borrar en Hevy un marcado que puso el usuario sería una
  # pérdida silenciosa de configuración, que es justo lo que este módulo evita.
  #
  # Con las rutinas de hoy la opción no cambia ni una serie -las 19 de
  # calentamiento ya vienen declaradas y la heurística no añade ninguna-, y ese
  # es precisamente su estado de destino. Empieza a mandar el día que un
  # ejercicio llegue a 4 series sin calentamiento declarado: sin ella, el motor
  # descontaría esa serie del cumplimiento y del volumen mientras la app la
  # sigue enseñando como efectiva, que es una discrepancia que nadie ve.
  write_warmup_type_to_hevy: true


# -----------------------------------------------------------------------------
# 6. REGLAS ESPECIALES
# -----------------------------------------------------------------------------
special_rules:
  - name: retirada_peso_muerto
    description: >
      Con molestia lumbar >= 5 dos días consecutivos, se retira el peso muerto
      de las rutinas durante 14 días y se avisa por Telegram.
    trigger:
      source: lower_discomfort
      when: {gte: 5}
      consecutive_days: 2
    action:
      remove_exercises: [peso_muerto_smith]
      duration_days: 14
    notify: true

  - name: descarga_press_hombro
    description: >
      Con molestia de tronco superior >= 6, se reduce la carga del press de
      hombro ese día (no se retira el ejercicio).
    trigger:
      source: upper_discomfort
      when: {gte: 6}
    action:
      reduce_load:
        exercises: [press_hombro_maquina]
        factor: 0.70
      duration_days: 1
    notify: true

  - name: semana_de_descarga
    description: >
      Semana de descarga automática: 60% de la carga y volumen recortado. Los
      intervalos van dentro de las rutinas y se recortan como el resto.
    trigger:
      every_n_weeks: 7        # dentro del rango 6-8 que pediste
      # Cuántas semanas puede EMPUJARLA el rojo. Nunca se adelanta: adelantar
      # exigiría saber que la semana que viene será mala. Decía
      # "adelantarse/retrasarse" y solo lo segundo era cierto.
      #
      # Es un presupuesto y no un permiso indefinido. Agotado, la descarga entra
      # aunque la semana siga en rojo: aplazarla mientras haya rojos la
      # convertiría en algo que no se hace nunca justo en la racha en que más
      # falta hace. Y mientras esté aplazada sigue DEBIDA -no se pierde hasta la
      # siguiente vuelta de siete semanas-. Ver `_deload_status`.
      jitter_weeks: 1
    action:
      load_factor: 0.60
      # Aquí había un `allow_hiit: true` con su historia: decidía si el bloque
      # HIIT aparte entraba en descarga. Desde el 26/09/2026 no hay bloques
      # aparte -los intervalos van dentro de cada rutina- y la descarga los
      # recorta como a cualquier otro ejercicio.
      duration_days: 7
    notify: true


# -----------------------------------------------------------------------------
# 7. ROTACIÓN DE FUERZA
# -----------------------------------------------------------------------------
# AQUÍ HABÍA UN CALENDARIO FIJO, Y LO QUE HIZO FUE PERDER SESIONES
# ----------------------------------------------------------------
# Había un `calendar` con dos variantes de temporada y un día de la semana
# asignado a cada rutina. La activa (`with_pool`) programaba lunes=dia_1 y
# jueves=dia_2, y NO nombraba `dia_3` ningún día. El Día 3 se entrena con
# normalidad desde el principio, así que todas esas sesiones entraron en el
# sistema como entrenamientos sueltos «que ese día no tocaba fuerza»: sin
# reconciliar contra ningún plan, sin racha, sin adopción de carga y sin
# progresión. La carga de los ejercicios del Día 3 no se movió NUNCA.
#
# No fue un fallo del código: el código hacía exactamente lo que el calendario
# decía. Fue un fichero que declaraba una semana que no era la de verdad, y una
# semana declarada mal no da error, da silencio.
#
# LO QUE MANDA AHORA ES LO QUE SE EJECUTA EN HEVY
# -----------------------------------------------
# No hay días asignados. La fuerza va en ciclo y el puntero sale de la ÚLTIMA
# sesión de esta lista que aparece EJECUTADA en `workout_log` (leída de Hevy
# por `routine_id`, nunca por el título: ver `routine_key_de`). Si la última
# fue `dia_2`, hoy toca `dia_3`, sea lunes o sea sábado.
#
# Se lee de lo EJECUTADO y no de lo planificado a propósito. Con lo planificado,
# un día que se decide y no se entrena adelantaría la rotación igual, y a los
# tres días el sistema estaría escribiendo el Día 3 cuando la última sesión
# real fue el Día 1. Leyendo lo ejecutado, un día sin entrenar simplemente no
# mueve nada: la rotación se aplaza sola, sin maquinaria de aplazamiento. Por
# eso ya no existen `pending_strength`, `defer_strength` ni
# `defer_expires_days`; y por eso un bloque de recuperación de día rojo tampoco
# avanza el ciclo, porque no es ninguna de estas rutinas.
#
# El orden es el ciclo. Cambiarlo cambia qué viene después de qué; quitar una
# rutina de aquí la saca del ciclo (y entonces `focus` sobra en ella, que es lo
# que comprueba el validador).
rotation:
  order: [dia_1, dia_2, dia_3]

# -----------------------------------------------------------------------------
# 7-bis. CICLISMO
# -----------------------------------------------------------------------------
# El Edge 1040 sincroniza con Garmin Connect; el sistema lee las actividades con
# get_activities_by_date y las guarda enteras (incluido raw_json) en la tabla
# `activities`. De ahí salen tres cosas: la clasificación de cada salida, la
# carga real que alimenta load_2d/load_7d, y la recomendación del fin de semana.
cycling:

  # Qué actividades de Garmin cuentan como ciclismo. Los nombres son los
  # activityType.typeKey que devuelve Connect.
  activity_types:
    - cycling
    - road_biking
    - gravel_cycling
    - mountain_biking
    - indoor_cycling
    - virtual_ride

  fetch:
    lookback_days: 10       # ventana que se re-lee cada mañana, por si el Edge
                            # sincronizó tarde o una salida se editó a posteriori

    # Sube de 90 a 210 porque el punto de partida de la bici
    # (`recommendation.baseline_from_gaps`) mira 180 días de huecos entre
    # salidas intensas, y una caché de 90 no puede sostener esa ventana. No es
    # que fallara: es que habría calculado los percentiles sobre la mitad de los
    # huecos que existen y habría dado OTRO número, sin decir nada. Los 30 de
    # margen son para que el arranque no quede justo en el filo.
    #
    # Esto no se puede desincronizar en silencio: el validador compara este
    # número contra `dias_adaptativos()`, que es la misma función que usa la
    # caché, y se niega a arrancar si se queda corto.
    backfill_days: 210      # solo en el primer arranque

  # ---------------------------------------------------------------------------
  # Clasificación de cada salida: SUAVE / MEDIA / INTENSA
  # ---------------------------------------------------------------------------
  # Se evalúa en orden. La primera que encaja gana; si no encaja ninguna, suave.
  #
  # CALIBRADO con tus 25 salidas de los últimos 90 días (jun-sep 2026).
  #
  # Los valores de partida (intensa >15% Z4-5, media >40% Z3) daban 10 INTENSA,
  # 0 MEDIA y 15 SUAVE. Al ordenar las 10 "intensas" por %Z4-5 aparece un hueco
  # claro: 61,2 - 54,0 - 33,1 - 32,6 || 27,2 - 24,5 - 22,3 - 18,0 - 17,1 - 15,9.
  # Las cuatro primeras son sesiones duras de verdad (carga 188-323); las seis
  # siguientes forman un continuo de rodajes tempo con carga 76-144.
  #
  # Cortando en 30% el clasificador coincide EXACTAMENTE con la etiqueta que
  # Garmin calcula por su cuenta (trainingEffectLabel), que no interviene en el
  # cálculo y sirve de comprobación independiente:
  #     INTENSA -> VO2MAX, VO2MAX, LACTATE_THRESHOLD, LACTATE_THRESHOLD  (4/4)
  #     MEDIA   -> TEMPO                                                 (1/1)
  #     SUAVE   -> AEROBIC_BASE / RECOVERY
  # Reparto resultante: 4 INTENSA, 4 MEDIA, 17 SUAVE.
  #
  # PENDIENTE DE RECALIBRACIÓN. La muestra son 25 salidas de una sola temporada,
  # así que estos dos cortes son los primeros candidatos a moverse. Se revisan
  # con /api/export, y el aviso de que toca lo da el mensaje de la mañana:
  # `program.recalibrar_cada_dias` arriba del todo. No hay que acordarse.
  classification:
    - level: intensa
      description: "Más del 30% del tiempo en Z4-Z5"
      zones: [4, 5]
      min_time_pct: 30
    - level: media
      description: "Más del 30% del tiempo en Z3"
      zones: [3]
      min_time_pct: 30
    - level: suave
      description: "El resto"
      always: true

  # Si Garmin no devuelve el reparto por zonas (pasa en actividades importadas
  # o sin sensor de FC), se clasifica con esta alternativa en vez de asumir
  # suave, que sería optimista y peligroso.
  classification_fallback:
    use: anaerobic_training_effect
    intensa_if_gte: 2.0
    media_if_gte: 1.0
    # Si tampoco hay training effect, la salida queda como `desconocida` y NO
    # dispara la regla del lunes: se anota como dato faltante en el log.
    on_no_data: desconocida

  # Las zonas de FC vienen tal cual de Garmin (`timeInZones` de cada actividad)
  # y no se configuran aquí. Hubo un bloque `hr_zones: {source, max_hr}` que no
  # leía nadie: ofrecía un `source: computed` que no existe en el código y un
  # `max_hr` para calcularlas a mano. Rellenar ese `max_hr` no habría cambiado
  # ni una clasificación. Está rechazado en el arranque para que no vuelva.

  # ---------------------------------------------------------------------------
  # Carga de entrenamiento
  # ---------------------------------------------------------------------------
  load:
    # De dónde sale la carga que alimenta load_2d / load_7d.
    source: activity_training_load    # activity_training_load | garmin_daily
    # Si una actividad no trae trainingLoad, se estima con duración x factor
    # según la clasificación. Aproximado, pero mejor que contarla como cero.
    fallback_estimate:
      enabled: true
      load_per_hour: {suave: 40, media: 90, intensa: 160}

  # ---------------------------------------------------------------------------
  # AQUÍ ESTABA `weekend: {days: [saturday, sunday]}`, Y SE HA BORRADO
  # ---------------------------------------------------------------------------
  # Decía qué días se agrupan al resumir el fin de semana. Lo leían
  # `weekend_summary` -que calculaba horas y salidas intensas del sábado y el
  # domingo- y `_intense_rides_this_weekend`, que ponía una nota en la
  # recomendación de bici. Las dos funciones se han borrado, así que el bloque
  # se queda sin un solo lector.
  #
  # Antes ya se habían ido de aquí `total_hours_threshold: 2.5` e
  # `intense_rides_threshold: 1`, los dos umbrales de `resaca_finde`, y el
  # comentario que quedó defendía lo que sobrevivía: «las horas y las salidas
  # intensas del fin de semana SIGUEN calculándose y guardándose; el sistema
  # registra lo que se hizo aunque no lo use para frenar». Sonaba bien y era
  # falso por dentro. Lo que se guardaba no era el registro: el registro son
  # las salidas enteras, que están en `data/cache/activities.json` y en la
  # tabla `activities` con su fecha, su duración y sus zonas. Lo que se
  # guardaba era un RESUMEN DERIVADO de eso, recalculable en tres líneas,
  # escrito todos los días en el snapshot y leído exactamente por nadie.
  # «Registrar» se había convertido en la excusa para no borrar.
  #
  # Y el fondo del asunto no es el código sobrante, es que agrupar por «sábado
  # y domingo» da por hecho que el esfuerzo grande cae en fin de semana. Eso es
  # el calendario fijo que se echó de `recommendation`, sobreviviendo dos
  # bloques más abajo. Lo que hacía falta saber -cuánta intensidad se lleva
  # encima- lo dice ahora `intensity_count` con una ventana rodante, y lo dice
  # los siete días.
  #
  # Si vuelve a escribirse, el arranque falla con ese motivo.

  # ---------------------------------------------------------------------------
  # Recomendación de bici (todos los días)
  # ---------------------------------------------------------------------------
  # Pipeline determinista, en este orden:
  #   1. `baseline_from_gaps` da el tipo de partida, contra el propio histórico
  #   2. se recorta al techo `actions.<semáforo>.bike_max`   <- ÚNICO RECORTE
  #   3. se añaden hechos de contexto que NO recortan: la intensa de ayer, las
  #      intensas ya hechas este fin de semana y el recuento de la semana
  # El resultado, el recorte y las notas se registran y salen en Telegram.
  #
  # QUIÉN DECIDE
  # ------------
  # El sistema no decide lo que se puede hacer: lo decide el usuario. El
  # sistema registra lo hecho y ajusta el resto. Por eso solo queda un recorte,
  # y es el del semáforo, que sale de HRV, sueño, pulso de reposo, carga de
  # Garmin y el check-in. Si una semana de siete días de bici deja el cuerpo
  # roto, eso se ve ahí y el semáforo da ámbar por el camino honesto. Frenar
  # porque una cuenta diga que se ha gastado un cupo es la cuenta decidiendo en
  # lugar del cuerpo, y se ha quitado entero.
  recommendation:
    enabled: true

    # --- Punto de partida: bandas sobre los huecos entre salidas intensas ----
    #
    # QUÉ SE HA BORRADO Y POR QUÉ
    # ---------------------------
    # Aquí vivían `recommend_on: [saturday, sunday]` y `baseline_by_weekday:
    # {saturday: intensa, sunday: media}`. Eran el calendario fijo aplicado a la
    # bici: daban por hecho que se sale en fin de semana y callaban el resto de
    # la semana. Medido sobre las 80 salidas reales del último año de Garmin:
    # el sistema NO dijo nada en 30 de ellas (38%), y 6 de esas 30 fueron
    # intensas. Los miércoles: 7 salidas, cero consejos. Las dos claves están
    # en la lista negra de más abajo para que no puedan volver en silencio.
    #
    # QUÉ HACE LO NUEVO
    # -----------------
    # Se miran los huecos en días entre salidas INTENSAS consecutivas dentro de
    # `window_days`, y se comparan los días transcurridos desde la última
    # intensa contra los percentiles de esa distribución propia:
    #
    #   días < p40              -> suave    (se acaba de hacer una)
    #   p40 <= días < p60       -> intensa  (se está en el ritmo propio y toca)
    #   días >= p60             -> media    (vuelta de un parón: volumen, no carga)
    #
    # La tercera banda NO es monótona, y es deliberado. La primera versión sí lo
    # era (`días >= p50 -> intensa`) y se cayó con datos reales: como los días
    # desde la última intensa crecen sin tope, durante un bloque suave largo el
    # sistema gritaba INTENSA seis semanas seguidas. Habría recomendado intensa
    # en 52 de 88 salidas (59%) cuando la tasa real es del 26%.
    #
    # POR QUÉ p40/p60 Y NO p25/p75, QUE ES LO QUE HABÍA AQUÍ
    # ------------------------------------------------------
    # Porque p25/p75 repetía el fallo de la versión monótona, con otra forma y
    # sin que se notara. El razonamiento que lo puso era "la banda de en medio
    # es el 50% central de mis huecos, o sea la mitad de las veces". Es falso, y
    # el error está en confundir dos cosas distintas:
    #
    #   - la MASA de la distribución de huecos (cuántos huecos caen dentro)
    #   - el TIEMPO que los días-desde-la-última pasan dentro de la banda
    #
    # El contador de días sube 1, 2, 3... y se queda en cada banda tantos días
    # como ANCHA sea la banda, no tantos como probable sea. Con huecos reales
    # muy dispersos -los del usuario en 180 días son [26, 1, 26, 2, 5, 2, 10,
    # 20, 55, 6, 8]- sale p25=3.5 y p75=23: la banda de en medio mide 19 días
    # de ancho y la de abajo 3. Resultado medido sobre sus salidas reales:
    #
    #   percentiles     % de veces que dice INTENSA     tasa real del usuario
    #   p25/p75                    61%                          21%
    #   p35/p55                    22%                          21%
    #   p40/p60                    17%                          21%
    #
    # 61% contra 21% es PEOR que el 59% contra 26% por el que se tiró la
    # versión monótona. Y era invisible: los dos bordes de seguridad seguían a
    # cero y la tabla de coincidencia no se movía, así que nada chillaba.
    #
    # Ese 21% es la tasa sobre el histórico ENTERO. La guarda de
    # `falsear_bici.py` no usa ese número: recalcula la tasa real sobre las
    # mismas salidas en las que el esquema tuvo base, que hoy son 36 y dan 19%.
    # Es un punto y medio de diferencia y da igual para la conclusión, pero se
    # deja escrito porque comparar el porcentaje del esquema -medido solo en los
    # días en que habla- contra la tasa del histórico completo -que incluye los
    # días en que calla- es dividir por cosas distintas y llamarlo comparación.
    #
    # p40/p60 es simétrico alrededor de la mediana: "intensa solo cuando los
    # días desde la última caen en el quinto central de tus propios huecos, o
    # sea cuando estás justo en tu ritmo". Se elige así, y no por ser el que
    # mejor ajusta, porque el ajuste son 36 salidas y a esa escala la diferencia
    # entre el 17% y el 22% son dos salidas. Una regla que se puede enunciar sin
    # mirar el resultado aguanta mejor que un número pescado de una tabla.
    # Comprobado además en las dos mitades del histórico por separado, donde
    # p25/p75 daba 79% y 41% -inestable además de alto- y p40/p60 da 21% y 12%.
    #
    # LO QUE ESTO **NO** ES
    # ---------------------
    # No es un predictor mejor. Medido con `--garmin 400` (88 salidas reales):
    #
    #   esquema                      coincide  callado  INT tras 1d  INT tras parón
    #   viejo (sat/sun)                   30%       35            1               5
    #   nuevo (3 bandas)                  30%       14            0               0
    #   constante 'media'                 34%        0            0               0
    #   constante 'suave'                 38%        0            0               0
    #
    # Acertar lo que se hizo NO mejora respecto a decir siempre lo mismo, y
    # queda escrito aquí porque ocultarlo sería exactamente el fallo que este
    # proyecto lleva meses persiguiendo. Lo que sí compra, y es por lo que está:
    # los dos extremos. Cero «intensa» al día siguiente de una intensa (el
    # calendario producía 1) y cero «intensa» volviendo de un parón de 30+ días
    # (el calendario producía 5, con una hernia L4-L5 de por medio). Y habla
    # todos los días, que era el encargo.
    #
    # `scripts/falsear_bici.py` vuelve a correr esta tabla contra los datos
    # reales, llamando al `_baseline_gaps` de verdad y no a una copia de estas
    # bandas. Sale con error si alguna de las dos columnas de la derecha deja de
    # ser cero, Y TAMBIÉN si la tasa de «intensa» se despega de la tasa real del
    # usuario. Esa segunda guarda no estaba y por eso p25/p75 pasó: una batería
    # que no mide lo que puede fallar da el visto bueno igual que una que sí.
    #
    # La tabla de arriba se midió con 400 días. Sin argumentos el guión lee la
    # caché de disco, que hoy son ~180 días y da otros números: menos histórico
    # detrás de cada fecha significa más días sin base y un `coincide` distinto.
    # No son resultados contradictorios, son ventanas distintas; para comparar
    # con esta tabla hay que pasarle los mismos 400 días.
    #
    # LOS NÚMEROS
    # -----------
    # `window_days: 180` sale de medir la estabilidad de los percentiles: con 60
    # o 90 días no hay huecos suficientes en los bloques flojos; con 365 la
    # ventana arrastra una temporada entera y deja de describir el momento.
    # `min_gaps: 4` es el mínimo para que p40 y p60 no sean dos puntos sueltos.
    # Por debajo de eso NO se inventa un valor por defecto: la recomendación se
    # marca como no aplicable con su motivo escrito, y se dice en el mensaje.
    baseline_from_gaps:
      window_days: 180
      min_gaps: 4
      percentile_low: 40
      percentile_high: 60
      level_below_low: suave
      level_between: intensa
      level_above_high: media

    # Ventana de `yesterday_ride_level`, que hoy solo alimenta una NOTA («ayer
    # hiciste una salida intensa»). Con 1, también cuenta el viernes de cara al
    # sábado. `no_consecutive_intense` y `after_intense_downgrade_to` vivían
    # aquí y recortaban; se han borrado, no desactivado.
    lookback_days: 1

    # --- Recuento rodante de sesiones intensas -----------------------------
    # ESTO YA NO ES UN PRESUPUESTO. Cuenta y se enseña; no limita nada.
    #
    # Cuenta como intensa cualquier HIIT EJECUTADO (no solo programado) y
    # cualquier salida clasificada como INTENSA. El número sale en el mensaje
    # todos los días y se guarda en `inputs_snapshot_json` para las métricas.
    #
    # Y AQUÍ SE VA EL SEGUNDO CALENDARIO: ERA `week_starts_on: monday`
    # -----------------------------------------------------------------
    # La cuenta empezaba el lunes y se ponía a cero a las doce de la noche del
    # domingo. Medido sobre las 58 salidas reales de la caché -184 días, 12
    # intensas-, la cuenta natural y una ventana rodante de 7 días NO COINCIDEN
    # en 39 de esos 184 días, uno de cada cinco. Y el desacuerdo tiene un solo
    # signo: la rodante nunca queda por debajo, y llega a estar +2 por encima.
    # La semana natural no se equivoca al azar, se equivoca SIEMPRE por lo bajo.
    #
    # El caso de libro es el lunes por la mañana. En 8 de 26 lunes -el 31%- el
    # mensaje decía «ninguna sesión intensa esta semana todavía» habiendo 1 o 2
    # intensas en los siete días anteriores; en tres de ellos, sábado Y domingo
    # intensos, doce horas antes de leerlo. La frase era cierta como frase y
    # mentira como información, que es la combinación más difícil de detectar:
    # no se la puede contradecir y engaña igual.
    #
    # Con `window_days: 7` el corte desaparece. Todos los días se miran los
    # mismos siete hacia atrás, extremos incluidos y terminando HOY, y el número
    # solo se mueve cuando se mueve lo que se ha hecho.
    #
    # POR QUÉ 7 ES UNA CONSTANTE Y NO UN PERCENTIL DE MI DISTRIBUCIÓN
    # ---------------------------------------------------------------
    # En este fichero casi todos los números se calculan contra el propio
    # histórico, y es la norma. Esta no lo hace, a propósito: `window_days` no
    # es un umbral. No se compara contra nada, no tiene denominador y no frena.
    # Es la UNIDAD en la que se cuenta, y una unidad tiene que quedarse quieta
    # para que el número de hoy se pueda comparar con el de la semana pasada.
    # Un periodo recalculado cada día movería el contador sin que se hubiera
    # hecho ni dejado de hacer nada: el mismo defecto que se está quitando.
    #
    # Se puede cambiar: si algún día 10 o 14 describen mejor el ciclo, se
    # escribe aquí y el mensaje dirá «en los últimos 14 días» solo. No hay
    # ningún 7 escrito en el código; si esta clave falta, el sistema para en vez
    # de suponerlo, porque el periodo va escrito en la frase que se lee a las
    # siete de la mañana y suponerlo sería ponerle unidades falsas.
    #
    # POR QUÉ SE FUE EL LÍMITE, Y CON ÉL EL BLOQUE ENTERO
    # ---------------------------------------------------
    # Se llamaba `intensity_budget`, tenía `weekly_limit: 4`, y con eso bajaba
    # la salida del sábado de intensa a suave. Medido sobre las 25 semanas
    # reales del histórico: con el límite en 3 recortaba 5 sábados de 25; al
    # subirlo a 4, cero. O sea que el número no estaba calibrado, estaba
    # buscando un sitio donde no molestar, que es la señal de que el freno
    # sobraba y no de que hiciera falta otro número.
    #
    # Con él se han ido `on_budget_exhausted`, `max_intense_rides_per_weekend`
    # y `require_green_for_intense`. Las cuatro claves están ahora en una lista
    # negra: si alguna reaparece en este fichero, el sistema no arranca. No es
    # celo: escribir `weekly_limit: 2` creyendo que se pone un tope y que no
    # pase nada es exactamente el fallo que este proyecto lleva meses pagando.
    #
    # Si alguna vez hace falta frenar por carga acumulada, el sitio es
    # `thresholds.amber.carga_acumulada`, que compara la carga de Garmin de 3
    # días contra el percentil 90 del propio histórico. Eso es el cuerpo
    # hablando. Un cupo semanal es una hoja de cálculo hablando.
    intensity_count:
      # `enabled` NO LO LEÍA NADIE, Y ESTE FICHERO LO CERTIFICABA
      # --------------------------------------------------------
      # El validador exigía la clave, exigía que fuera booleana, y su mensaje
      # de error decía por escrito que para no contar había que ponerla a
      # `false`. `intensity_count()` no la miraba en ningún sitio: se podía
      # apagar y seguía contando, el número seguía saliendo en el mensaje todas
      # las mañanas, y el fichero validaba sin una queja. Una opción muerta que
      # además viene certificada como viva no se descubre nunca, porque quien la
      # apaga se queda convencido de haberla apagado.
      #
      # No lo encontró una revisión del código: lo encontró una mutación que
      # sobrevivía al lado (`scripts/mutar_bici.py`, tanda W10).
      #
      # Ya está conectada. En `false` el recuento no se calcula, la línea
      # desaparece del mensaje, y la señal `intense_count_7d` NO SE ESCRIBE: no
      # se escribe a cero, porque un cero afirma que no has apretado y se queda
      # en el histórico igual que uno contado de verdad.
      enabled: true
      window_days: 7
      counts_as_intense:
        hiit_executed: true       # HIIT realmente hecho, leído de Hevy
        ride_intensa: true        # salida clasificada INTENSA
        strength_session: false   # la fuerza normal no cuenta

    # Textos y duraciones orientativas que van al mensaje de Telegram.
    types:
      intensa:
        label: "Intensa"
        detail: "Series en Z4-Z5. Calienta bien antes."
        duration_min: 90
        duration_max: 150
      media:
        label: "Media"
        detail: "Z2 con tramos sostenidos en Z3, sin series estructuradas."
        duration_min: 120
        duration_max: 180
      suave:
        label: "Suave"
        detail: "Z2 continuo, sin series. Si dudas, más corto."
        duration_min: 90
        duration_max: 150
      descanso:
        label: "Descanso"
        detail: "Sin bici. Paseo muy suave como mucho."
        duration_min: 0
        duration_max: 60

    # Orden de menor a mayor intensidad. Lo usa el motor para aplicar los topes.
    intensity_order: [descanso, suave, media, intensa]


# -----------------------------------------------------------------------------
# 8. HIIT
# -----------------------------------------------------------------------------
hiit:
  # LOS BLOQUES HIIT APARTE SE RETIRARON EL 26/09/2026. Eran rutinas propias
  # en Hevy («Día 1 HIIT», «Día 2 HIIT») que el sistema añadía en verde y
  # escribía aparte. El Día 2 se fusionó el 25/09 y el Día 1 el 26/09, por
  # decisión del usuario: una sola rutina que abrir en el gimnasio.
  #
  # El mecanismo de bloques sigue en el código, apagado, por si algún día se
  # quiere volver a separar. Con `enabled: false` el validador RECHAZA sus
  # claves -`allowed_routines`, `blocks`, `only_on_green`, `start_week`,
  # `program_start_date` y `allow_hiit` en `actions` y en las reglas-: puestas
  # ahí no las leería nadie, y parecerían gobernar algo.
  enabled: false

  # Día 3 (viernes) NUNCA lleva HIIT. Es la sesión ligera previa a la bici del
  # fin de semana y esa función se pierde si se le añade intensidad. Lo vigila
  # el validador sobre `embedded`: un intervalo declarado dentro del Día 3 no
  # arranca.
  never_routines: [dia_3]

  # Los intervalos de cada rutina, que viven DENTRO de ella. Sin esto nada
  # sabría que son HIIT: el recuento de sesiones intensas no los vería y
  # `safety.forbidden_in_hiit` no los recorrería. Un entreno cuenta como HIIT
  # si lleva al menos una serie de alguno; si la rutina se hace sin ellos, no
  # cuenta. Cada clave tiene que existir en su rutina.
  embedded:
    dia_1: [remo_maquina, suitcase_carry, air_bike, plancha_frontal, wall_ball]
    dia_2: [battle_ropes, comba, ski_erg, step_up]


# -----------------------------------------------------------------------------
# 9. RUTINAS
# -----------------------------------------------------------------------------
# Formato de cada ejercicio:
#   key:            identificador estable interno (no cambiarlo: es la clave de
#                   `exercise_targets` en la BD y de las reglas especiales)
#   template_id:    exercise_template_id de Hevy. Es independiente del idioma:
#                   por eso funciona aunque tu app esté en español.
#   name:           etiqueta para el mensaje de Telegram
#   superset_id:    si el ejercicio va en superserie, el id del grupo. Debe
#                   guardarse: el PUT de Hevy reemplaza la rutina entera, así
#                   que omitirlo deshace la superserie en la app.
#   sets:           lista literal de series. Cada una:
#                     reps / weight_kg / duration_s / distance_m (los que
#                     apliquen), y opcionalmente `type: warmup`
#                   Se reproduce tal cual en Hevy, incluidas las rampas. Qué
#                   series cuentan como calentamiento lo decide `set_types`.
#   increment_kg:   cuánto sube cuando toca progresar
#   apply_to:       top_set | all_sets
#   clean_sessions_required: sesiones limpias seguidas antes de subir
#   expendable_in_amber: true -> se elimina en días ámbar
#   notes:          nota que se escribe en la rutina de Hevy

routines:

  # ---------------------------------------------------------------------------
  dia_1:
    title: "Día 1"
    hevy_routine_id: "29ce5818-5442-4a40-9e70-1e74904d5867"
    focus: "Tren inferior + core"
    # DECISIONES CERRADAS, no son omisiones (leído de la API el 07-09-2026):
    #   - El curl-up de McGill está retirado a propósito. El core de este día es
    #     plancha lateral + perro de caza + bosu. No lo eches en falta ni lo
    #     vuelvas a meter "porque falta".
    #   - El bosu de propiocepción y la elevación de cadera son intencionados.
    #   - El paseo del granjero a una mano va en el bloque de intervalos del
    #     final, que es donde toca.
    #   - El perro de caza pasó de 2 a 3 series el 07-09-2026; ya coincide con
    #     el del Día 3.
    exercises:

      - key: prensa_horizontal
        template_id: "0EB695C9"
        name: "Prensa horizontal"
        increment_kg: 5
        apply_to: top_set
        progression_type: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 40}
          - {reps: 12, weight_kg: 70}
          - {reps: 12, weight_kg: 80}
          - {reps: 12, weight_kg: 100}

      - key: extension_cuadriceps
        template_id: "75A4F6C4"
        name: "Extensión de cuádriceps"
        increment_kg: 2.5
        apply_to: all_sets
        progression_type: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 20}
          - {reps: 12, weight_kg: 30}
          - {reps: 12, weight_kg: 35}
          - {reps: 12, weight_kg: 40}

      - key: patada_atras
        template_id: "1ADF8723"
        name: "Patada atrás (máquina)"
        increment_kg: 2.5
        apply_to: all_sets
        clean_sessions_required: 2      # cadena posterior
        # Cadena posterior: primero series, después carga. NO estaba en la lista
        # de tres que diste (hip thrust, peso muerto, curl femoral), pero es
        # cadena posterior igual. Si prefieres que aquí mande la carga, cambia
        # esta línea a `double` y no hay que tocar nada más.
        progression_type: sets
        max_sets: 4
        then: double
        rep_range: [20, 24]
        sets:
          - {type: warmup, reps: 20, weight_kg: 20}
          - {reps: 24, weight_kg: 35}
          - {reps: 24, weight_kg: 35}
          - {reps: 24, weight_kg: 35}

      - key: gemelo_sentado
        template_id: "062AB91A"
        name: "Elevación de gemelo sentado"
        increment_kg: 5
        apply_to: top_set
        expendable_in_amber: true
        # Releído de Hevy el 11-09-2026 salía 70 → 60 → 65, y se dejó tal cual
        # porque el config reproduce Hevy y no al revés. Confirmado el 16-09-2026
        # que el 70 de la primera efectiva era un dedazo: la rampa es 60 → 65 →
        # 70 y así queda. Se han REORDENADO las tres series enteras, sin tocar
        # ninguna rep: los pares que había -(70,12), (60,12), (65,15)- son los
        # mismos puestos de menos a más peso. Reordenar solo los kilos habría
        # dejado las 15 repeticiones en la serie más pesada, que es un cambio de
        # entrenamiento que nadie pidió.
        #
        # El cambio solo llega a la sesión si este ejercicio NO tiene todavía
        # fila en `exercise_targets` (`con_carga_vigente`: el YAML es el punto de
        # partida y nada más). Tenía fila, así que esto de aquí no cambió nada
        # durante cinco días: el fichero decía una rampa y se entrenaba otra.
        # Corregido en la base el 16-09-2026.
        #
        # Y el comando que había escrito aquí -«60,65,70»- era el equivocado.
        # `fijar_carga.py` con pesos sueltos NO mueve las repeticiones, así que
        # habría dejado 12×60, 12×65, 15×70: las 15 reps en la serie más pesada,
        # que es justo lo que el párrafo de arriba dice que no se quería. La
        # forma que reordena el par entero es
        # `scripts/fijar_carga.py --contenedor dia_1 gemelo_sentado 60x12,65x15,70x12 --aplicar`.
        # Que la base y este fichero no se separen otra vez lo vigila
        # `scripts/auditar_cargas.py`, que solo lee.
        progression_type: double
        rep_range: [12, 15]
        sets:
          - {type: warmup, reps: 10, weight_kg: 40}
          - {reps: 12, weight_kg: 60}
          - {reps: 15, weight_kg: 65}
          - {reps: 12, weight_kg: 70}

      - key: press_triceps_sentado
        template_id: "234BC743"
        name: "Press de tríceps sentado"
        increment_kg: 2.5
        apply_to: all_sets
        expendable_in_amber: true
        # Se queda en 4 series (1 de calentamiento + 3 efectivas): confirmado
        # como intencionado, no es un resto sin limpiar.
        # CARGA REGISTRADA el 11-09-2026: 50/55/60 en las efectivas. Antes iban
        # las cuatro a 0 kg y eso dejaba la progresión de carga muerta, porque
        # `_can_raise_load` no inventa una carga inicial partiendo de cero. Ya
        # no aplica: hay dato, y la progresión de carga está viva.
        # Las reps bajaron de 15 a 12 al registrar el peso, que es lo lógico:
        # con carga real, 12 es el suelo del rango y hay recorrido hasta 15
        # antes de que toque subir kilos.
        progression_type: double
        rep_range: [12, 15]
        sets:
          - {type: warmup, reps: 10, weight_kg: 40}
          - {reps: 12, weight_kg: 50}
          - {reps: 12, weight_kg: 55}
          - {reps: 12, weight_kg: 60}

      - key: elevacion_cadera_unilateral
        template_id: "487B3755"
        # NOMENCLATURA: en Hevy figura como "Empuje de Cadera a Una Pierna"
        # (Single Leg Hip Thrust), pero el ejercicio real es una ELEVACIÓN DE
        # CADERA. El catálogo de Hevy no tiene una entrada mejor. La nota que
        # ya tienes escrita en la rutina dice justo eso.
        name: "Elevación de cadera a una pierna"
        notes: "ELEVACIÓN CADERA"
        clean_sessions_required: 2      # cadena posterior
        # Releído de Hevy el 11-09-2026: 12 reps por serie, no 20. El tope de
        # `max_reps` se queda en 30 -sigue siendo el techo correcto para una
        # elevación de cadera a una pierna- pero ahora hay bastante más
        # recorrido por delante del que había.
        progression_type: volume
        max_reps: 30
        sets:
          - {reps: 12}
          - {reps: 12}
          - {reps: 12}

      - key: plancha_lateral
        template_id: "E3EDA509"
        name: "Plancha lateral"
        progression_type: volume
        max_seconds: 45
        sets:
          - {duration_s: 20}
          - {duration_s: 20}
          - {duration_s: 20}

      - key: perro_de_caza
        template_id: "BD0AD077"
        name: "Perro de caza"
        progression_type: volume
        max_reps: 30
        sets:
          - {reps: 20}
          - {reps: 20}
          - {reps: 20}

      - key: bosu_propiocepcion
        template_id: "10282350-8d6a-48de-9886-82f4cd111a67"   # ejercicio propio
        name: "Bosu propiocepción"
        expendable_in_amber: true
        # Progresa por tiempo, no por el lastre: en propiocepción aguantar más
        # es el objetivo, y más peso solo cambia el ejercicio.
        progression_type: volume
        max_seconds: 45
        sets:
          - {weight_kg: 10, duration_s: 20}
          - {weight_kg: 10, duration_s: 20}
          - {weight_kg: 10, duration_s: 20}

      # --- Bloque de intervalos, fijo desde el 26/09/2026 -------------------
      #
      # Hasta aquí esto era `hiit_dia_1`, una rutina aparte que solo se escribía
      # en día verde. Se fusiona como se fusionó el Día 2 el 25/09: una sola
      # rutina que abrir en el gimnasio. Lo mismo que se perdió allí se pierde
      # aquí, y está escrito en el Día 2: ya NO es condicional (en ámbar está
      # también, y el ámbar le recorta series como a todo), y si se quiere que
      # el ámbar lo quite, la pieza es `expendable_in_amber: true` en estos.
      #
      # Están declarados en `hiit.embedded`: es lo que los hace contar como
      # HIIT y pasar por `safety.forbidden_in_hiit`. Uno que se añada aquí y no
      # allí no pasa por esa guarda.
      - key: remo_maquina
        template_id: "0222DB42"
        name: "Remo (máquina)"
        progression_type: none
        sets: [{duration_s: 30}, {duration_s: 30}, {duration_s: 30}]

      - key: suitcase_carry
        template_id: "7593855D"
        name: "Paseo del granjero a una mano"
        # La carga sigue sin prescribirse -se coge lo que haya y no progresa-,
        # pero la DURACIÓN sí, y no es un adorno: una serie que no pide ni reps
        # ni segundos no se puede juzgar, y `_alcanza` revienta al intentarlo.
        # 30 s es lo que dura cada estación del resto del circuito (remo, air
        # bike, plancha), así que no cambia el entrenamiento: lo escribe.
        progression_type: none
        sets:
          - {duration_s: 30}
          - {duration_s: 30}
          - {duration_s: 30}

      - key: air_bike
        template_id: "43573BB8"
        name: "Air bike"
        progression_type: none
        sets: [{duration_s: 30}, {duration_s: 30}, {duration_s: 30}]

      # Sustituye a "Abdominales (sit up)" (template 022DF610), retirado por la
      # hernia L4-L5: flexión lumbar repetida bajo fatiga. Ver `safety`.
      - key: plancha_frontal
        template_id: "C6C9B8A0"
        name: "Plancha frontal"
        progression_type: volume
        max_seconds: 60
        sets: [{duration_s: 30}, {duration_s: 30}, {duration_s: 30}]

      - key: wall_ball
        template_id: "A1F47ACC"
        name: "Wall ball"
        progression_type: none
        sets:
          - {reps: 20, weight_kg: 5}
          - {reps: 20, weight_kg: 5}
          - {reps: 20, weight_kg: 5}

  # ---------------------------------------------------------------------------
  dia_2:
    title: "Día 2"
    hevy_routine_id: "1f1b439c-a769-46e6-a83c-405fabfa3c96"
    focus: "Cadena posterior + espalda"
    exercises:

      - key: hip_thrust_barra
        template_id: "D57C2EC7"
        # NOMENCLATURA: en Hevy figura como "Empuje de Caderas (Barra)" porque
        # el catálogo no tiene entrada para las máquinas Technogym. El
        # ejercicio real es un HIP THRUST EN MÁQUINA, no con barra libre.
        name: "Hip thrust (máquina)"
        increment_kg: 5
        apply_to: all_sets
        clean_sessions_required: 2      # cadena posterior
        # Reps objetivo añadidas en Hevy el 07-09-2026; CARGA añadida el
        # 11-09-2026: 10 kg en las tres efectivas. Con esto el ejercicio deja de
        # estar a ciegas.
        # El calentamiento sigue a 0 kg y está bien así: `_can_raise_load` solo
        # mira las series EFECTIVAS, y ningún incremento toca los
        # calentamientos (`_split` los aparta antes de sumar). Un 0 ahí no
        # bloquea nada.
        # OJO a la primera efectiva: va a 10 reps y las otras dos a 12. La
        # puerta `require_all_sets_at_target_reps` exige que TODAS lleguen al
        # tope del rango, así que mientras esa serie se quede en 10 no se
        # añadirá la cuarta. No es un fallo, es la puerta haciendo su trabajo.
        progression_type: sets
        max_sets: 5
        then: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 0}
          - {reps: 10, weight_kg: 10}
          - {reps: 12, weight_kg: 10}
          - {reps: 12, weight_kg: 10}

      - key: curl_femoral_pie
        template_id: "6120CAAB"
        name: "Curl femoral de pie"
        increment_kg: 2.5
        apply_to: all_sets
        clean_sessions_required: 2      # cadena posterior
        # Carga registrada el 11-09-2026: rampa 10 / 12,5 / 15. Ya no falta
        # nada. El calentamiento a 0 kg no estorba (ver hip_thrust_barra).
        progression_type: sets
        max_sets: 5
        then: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 0}
          - {reps: 12, weight_kg: 10}
          - {reps: 12, weight_kg: 12.5}
          - {reps: 12, weight_kg: 15}

      - key: peso_muerto_smith
        template_id: "20870ED5"
        # NOMENCLATURA: en Hevy figura como "Peso Muerto (Máquina Smith)"
        # porque el catálogo no tiene la máquina. El ejercicio real es un peso
        # muerto EN MÁQUINA TECHNOGYM GUIADA. No es una barra libre ni un
        # multipower, y esa diferencia es justo la que lo hace admisible con la
        # hernia L4-L5: es un ejercicio de rehabilitación en este caso.
        # Por eso la restricción de `safety` NO lo bloquea aquí: solo se aplica
        # a las rutinas HIIT. Aquí está controlado y vigilado por la regla
        # `retirada_peso_muerto`, que es su objetivo.
        name: "Peso muerto (máquina guiada)"
        increment_kg: 5
        apply_to: all_sets
        clean_sessions_required: 2      # cadena posterior
        # Carga registrada el 11-09-2026: 20 / 22,5 / 22,5. El calentamiento a
        # 0 kg no estorba (ver hip_thrust_barra).
        # DISCREPANCIA ANOTADA: al añadir las reps dijiste 10 para este
        # ejercicio, pero Hevy devuelve 12 en las tres series efectivas, igual
        # que en los otros tres. Se reproduce lo que hay en Hevy. Si querías 10,
        # cámbialo allí y este bloque se regenera en la siguiente lectura.
        # Techo de series más bajo que el resto de la cadena posterior: es el
        # ejercicio que vigila `retirada_peso_muerto`, y aquí el volumen tampoco
        # es gratis.
        progression_type: sets
        max_sets: 4
        then: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 0}
          - {reps: 12, weight_kg: 20}
          - {reps: 12, weight_kg: 22.5}
          - {reps: 12, weight_kg: 22.5}

      - key: jalon_al_pecho
        template_id: "6A6C31A5"
        name: "Jalón al pecho"
        increment_kg: 5
        apply_to: top_set
        progression_type: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 30}
          - {reps: 12, weight_kg: 40}
          - {reps: 12, weight_kg: 40}
          - {reps: 12, weight_kg: 40}

      - key: remo_t_apoyado
        template_id: "6A8D3193"
        # NOMENCLATURA: en Hevy figura como "Remo en T con Apoyo de Pecho"
        # (Chest Supported T Bar Row). El ejercicio real es un CHEST SUPPORTED
        # ROW en máquina, sin barra en T.
        name: "Remo con apoyo de pecho"
        increment_kg: 2.5
        apply_to: all_sets
        # Carga registrada el 11-09-2026: rampa 15 / 17,5 / 20, y aquí hasta el
        # calentamiento lleva peso (5 kg). Ya no falta nada.
        progression_type: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 5}
          - {reps: 12, weight_kg: 15}
          - {reps: 12, weight_kg: 17.5}
          - {reps: 12, weight_kg: 20}

      - key: face_pull
        template_id: "BE640BA0"
        name: "Tirón a la cara"
        increment_kg: 2.5
        apply_to: top_set
        progression_type: double
        rep_range: [12, 15]
        sets:
          - {type: warmup, reps: 10, weight_kg: 7.5}
          - {reps: 15, weight_kg: 12.5}
          - {reps: 15, weight_kg: 12.5}
          - {reps: 15, weight_kg: 12.5}

      - key: dead_bug
        template_id: "D8911FC4"
        name: "Dead bug"
        progression_type: volume
        max_reps: 30
        sets:
          - {reps: 20}
          - {reps: 20}
          - {reps: 20}

      - key: pallof_press
        template_id: "CC55119B"
        name: "Press Pallof en polea"
        progression_type: volume
        max_reps: 30
        sets:
          - {reps: 20, weight_kg: 0}
          - {reps: 20, weight_kg: 0}
          - {reps: 20, weight_kg: 0}

      - key: plancha_lateral
        template_id: "E3EDA509"
        name: "Plancha lateral"
        # Releído de Hevy el 11-09-2026: 20 s, no 30. El tope se queda en 60.
        progression_type: volume
        max_seconds: 60
        sets:
          - {duration_s: 20}
          - {duration_s: 20}
          - {duration_s: 20}

      # --- Bloque de intervalos, fijo desde el 25/09/2026 -------------------
      #
      # Hasta aquí esto era `hiit_dia_2`, una rutina aparte que solo se escribía
      # en día verde. Se fusiona por decisión del usuario: una sola rutina que
      # abrir en el gimnasio en vez de dos.
      #
      # LO QUE SE PIERDE AL FUSIONARLO, ESCRITO PARA QUE NO SE REDESCUBRA:
      #
      #   - Ya NO es condicional. Antes `hiit.only_on_green` lo retiraba en día
      #     ámbar; ahora está siempre. Si algún día se quiere recuperar ese
      #     comportamiento sin volver a partir la rutina, la pieza que hace
      #     falta ya existe y es `expendable_in_amber: true` en estos cuatro:
      #     el ámbar los quitaría y el resto del Día 2 seguiría igual.
      #   - Al moverlo dejó de recorrerlo la guarda de `safety.forbidden_in_hiit`,
      #     que solo miraba las rutinas de `hiit.blocks`. Desde la tarde del
      #     mismo 25/09 vuelve a recorrerlo porque los cuatro están declarados en
      #     `hiit.embedded`. OJO: un ejercicio que se añada aquí abajo solo pasa
      #     por esa guarda -y solo cuenta como HIIT- si se añade también allí.
      #
      # `progression_type: none` en los cuatro: son intervalos por tiempo, no
      # hay carga que progresar.
      - key: battle_ropes
        template_id: "084A67CA"
        name: "Cuerdas de batalla"
        notes: "40 - 20"
        progression_type: none
        sets: [{duration_s: 40}, {duration_s: 40}, {duration_s: 40}]

      - key: comba
        template_id: "040BA2E3"
        name: "Salto a la cuerda"
        progression_type: none
        sets: [{duration_s: 40}, {duration_s: 40}, {duration_s: 40}]

      - key: ski_erg
        template_id: "5D99A2FA"
        name: "Ski erg"
        notes: "40 - 20"
        progression_type: none
        sets: [{duration_s: 40}, {duration_s: 40}, {duration_s: 40}]

      - key: step_up
        template_id: "128A2381"
        name: "Step up"
        notes: "40 - 20"
        progression_type: none
        sets: [{reps: 40}, {reps: 40}, {reps: 40}]

  # ---------------------------------------------------------------------------
  dia_3:
    title: "Día 3"
    hevy_routine_id: "05e27b0c-7c9e-484c-a9aa-1c78622bc0c2"
    focus: "Caderas + hombro + brazo + core"
    # Estuvo fuera del calendario fijo y por eso no progresó nunca; ahora es el
    # tercer paso de `rotation.order`, igual de real que los otros dos.
    # DECISIONES CERRADAS: este día lleva vuelos posteriores con mancuernas
    # (rear delt fly), NO remo con apoyo de pecho. Son ejercicios distintos y
    # está bien así. Y nunca lleva HIIT: ver `hiit.never_routines`.
    exercises:

      - key: abduccion_cadera
        template_id: "F4B4C6EE"
        name: "Abducción de cadera"
        increment_kg: 5
        apply_to: top_set
        progression_type: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 40}
          - {reps: 12, weight_kg: 45}
          - {reps: 12, weight_kg: 50}
          - {reps: 12, weight_kg: 55}

      - key: aduccion_cadera
