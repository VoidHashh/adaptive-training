# =============================================================================
# adaptive-training — configuración del motor de decisión
# =============================================================================
# Este archivo es la ÚNICA fuente de verdad de las rutinas y de los umbrales.
# El motor no usa ningún LLM: son reglas explícitas, deterministas y auditables.
#
# Importante: la API de Hevy (PUT /v1/routines/{id}) REEMPLAZA la rutina entera,
# no hace parche. Por eso las rutinas se definen aquí completas: cada mañana el
# sistema reconstruye la rutina del día desde este YAML aplicando la decisión.
# Si editas una rutina en la app de Hevy, el cambio se perderá en la siguiente
# escritura. Edítala aquí.
#
# Cada cambio de este archivo genera un config_hash distinto que se guarda con
# cada decisión, para poder saber con qué configuración se decidió cada día.
# =============================================================================

version: 1
timezone: Europe/Madrid


# -----------------------------------------------------------------------------
# 0-bis. PROGRAMA
# -----------------------------------------------------------------------------
# `start` es el origen desde el que se cuentan las semanas de descarga. NO es
# decorativo y NO puede quedarse vacío: sin él, `special_rules.semana_de_descarga`
# no tiene desde dónde contar `every_n_weeks` y la descarga no se activa NUNCA.
# Un sistema que progresa sin descargar es un sistema que acumula fatiga hasta
# que algo cede, y con 44 años, déficit calórico y una hernia L4-L5 eso no es un
# riesgo aceptable.
#
# Por eso el cargador se NIEGA A ARRANCAR si falta o está en null, en vez de
# apuntarlo en una nota del informe. Una nota se lee el primer día y se ignora
# el resto; un arranque fallido se arregla.
program:
  start: 2026-09-08   # AAAA-MM-DD. Origen del contador de descargas.


# -----------------------------------------------------------------------------
# 0-ter. INTERRUPTORES DE ESCRITURA
# -----------------------------------------------------------------------------
# Todo lo que sale del sistema hacia fuera pasa por aquí. Empiezan APAGADOS.
#
# El motivo de que `hevy.write_enabled` arranque en false no es la desconfianza
# en el código: es que `PUT /v1/routines/{id}` REEMPLAZA la rutina entera, así
# que el coste de una decisión mal construida no es un mal día de entreno, es
# una rutina destruida. Con el interruptor apagado el sistema decide, avisa por
# Telegram y registra qué HABRÍA escrito, pero no toca Hevy. Eso permite correr
# una semana en seco comparando cada mañana el mensaje con lo que uno habría
# hecho, y encenderlo solo cuando las dos cosas coincidan.
#
# El interruptor NO afecta a la reversión: si algo se rompió mientras estaba
# encendido, se puede deshacer aunque luego se apague.
integrations:
  hevy:
    write_enabled: false

    # Copias de seguridad antes de cada escritura. No es configurable que se
    # hagan —sin copia verificada no se escribe, y eso está en el código— pero
    # sí cuántas se conservan.
    backup:
      keep_last: 30

  telegram:
    send_enabled: true   # los mensajes sí se envían: leer no rompe nada


# -----------------------------------------------------------------------------
# 0. RESTRICCIONES DE SEGURIDAD — hernia discal L4-L5
# -----------------------------------------------------------------------------
# Esto NO es un umbral que se recalibre: es una restricción permanente. El
# cargador de configuración se niega a arrancar si alguna rutina HIIT contiene
# un ejercicio de esta lista, para que un cambio hecho con prisa en Hevy y
# copiado aquí no meta un patrón contraindicado sin que nadie se dé cuenta.
#
# Ámbito: SOLO las rutinas HIIT. En la fuerza normal el peso muerto sí está
# permitido (Día 2) porque va controlado, a repeticiones bajas y con la regla
# `retirada_peso_muerto` vigilándolo. Lo que se prohíbe es ese mismo patrón
# ejecutado con prisa y bajo fatiga, que es lo que define un HIIT.
safety:
  condition: "Hernia discal L4-L5"

  forbidden_in_hiit:
    reason: >
      Ningún ejercicio con flexión lumbar repetida bajo carga ni con carga
      axial explosiva puede entrar en las rutinas HIIT.

    # Bloqueo por template_id: es el criterio fuerte, independiente del idioma
    # y del nombre que le pongamos aquí. IDs verificados contra el catálogo
    # real de Hevy (453 plantillas).
    template_ids:
      # --- flexión lumbar repetida ---
      - {id: "022DF610", name: "Sit Up"}
      - {id: "9237BA12", name: "Sit Up (Weighted)"}
      - {id: "32B0B590", name: "Jackknife Sit Up"}
      - {id: "DCF3B31B", name: "Crunch"}
      - {id: "EB43ADD4", name: "Crunch (Machine)"}
      - {id: "D928C232", name: "Crunch (Weighted)"}
      - {id: "BC10A922", name: "Decline Crunch"}
      - {id: "B2398CD1", name: "Decline Crunch (Weighted)"}
      - {id: "A41C7261", name: "Bicycle Crunch"}
      - {id: "594450D2", name: "Bicycle Crunch Raised Legs"}
      - {id: "23A48484", name: "Cable Crunch"}
      - {id: "DBE341AA", name: "Oblique Crunch"}
      - {id: "7952B5CD", name: "Reverse Crunch"}
      - {id: "6BE68B62", name: "V Up"}
