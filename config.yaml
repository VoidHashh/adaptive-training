      - key: perro_de_caza
        template_id: "BD0AD077"
        name: "Perro de caza"
        progression_type: volume
        max_reps: 30
        sets:
          - {reps: 20}
          - {reps: 20}
          - {reps: 20}

      - key: dead_bug
        template_id: "D8911FC4"
        name: "Dead bug"
        progression_type: volume
        max_reps: 30
        sets:
          - {reps: 20}
          - {reps: 20}
          - {reps: 20}

      # Estos dos van en SUPERSERIE en Hevy (superset_id 0). Hay que guardarlo:
      # el PUT de rutinas es un reemplazo completo, no un parche, así que una
