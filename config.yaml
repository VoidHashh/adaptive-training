  #
  # Que no estén en el ciclo también significa que hacer un HIIT suelto no
  # avanza la rotación, que es lo correcto: el HIIT se añade a una sesión de
  # fuerza, no la sustituye.
  #
  # Llevaban un `standalone: false` que no leía nadie. Repetía en forma de
  # interruptor un hecho que no es configurable: quién entra en el ciclo lo
  # dice `rotation.order` (que no los nombra) y `hiit.blocks` los ata a dia_1
  # y dia_2. Ponerlo a `true` no los habría programado ningún día.


# -----------------------------------------------------------------------------
# 10. BLOQUES DE RECUPERACIÓN (días rojos)
# -----------------------------------------------------------------------------
# Sustituyen a la sesión de fuerza. Movilidad y core suave, nada de carga.
recovery_blocks:
  recuperacion_suave:
    title: "Recuperación"
    write_to_hevy: false      # no reescribe la rutina; solo se manda por Telegram
    exercises:
      - {key: dead_bug, template_id: "D8911FC4", name: "Dead bug", sets: [{reps: 15}, {reps: 15}]}
      - {key: perro_de_caza, template_id: "BD0AD077", name: "Perro de caza", sets: [{reps: 15}, {reps: 15}]}
      - {key: plancha, template_id: "C6C9B8A0", name: "Plancha", sets: [{duration_s: 20}, {duration_s: 20}]}
      - {key: caminar, template_id: "33EDD7DB", name: "Caminar 20-30 min suave", sets: [{}]}


# -----------------------------------------------------------------------------
# 11. PROGRAMACIÓN Y AVISOS
# -----------------------------------------------------------------------------
schedule:
  garmin_fetch_time: "06:30"    # lee Garmin antes de que te levantes
  fallback_decision_time: "09:00"   # si no hay check-in, decide solo con Garmin
  evening_summary_time: "22:30"     # captura lo entrenado para el histórico

  # El aviso de percepción: evalúa la sesión de AYER y, si esa mañana te
  # puntuaste mucho peor de lo que luego rendiste, lo cuenta con los números.
  #
  # Va DESPUÉS de `fallback_decision_time` y no es un detalle de orden. Es un
  # mensaje aparte y sobre ayer; si llegara antes del plan de hoy se leerían
  # como una sola cosa y el contador se convertiría en el preámbulo de la
  # decisión, que es justo lo que no puede ser. Y hace falta el check-in de esta
  # mañana -de ahí sale el esfuerzo percibido de ayer-, así que antes de las
  # nueve tampoco habría nada que evaluar.
  perception_notice_time: "09:30"

  # Reintentos ante un 429. Garmin limita por IP durante MINUTOS, así que las
  # esperas van en esa escala: insistir cada dos segundos solo gasta intentos
  # dentro del mismo bloqueo.
  #
  # Entre N intentos hay N-1 esperas, y el validador lo exige: una lista corta
  # repetiría la última en silencio y el margen real no sería el que se lee aquí.
  #
  # No hay `notify_on_final_failure`: un 429 que sobrevive a todos los intentos
  # sale del trabajo como excepción, y el avisador del scheduler manda por
  # Telegram CUALQUIER trabajo que falle. Es incondicional a propósito. La única
  # posición útil de ese interruptor era `true`, y tenerlo escrito sugería que
  # existía la otra.
  garmin_retry:
    attempts: 3
    backoff_seconds: [60, 300, 900]

# Aquí SOLO va lo que cambia el contenido del mensaje. El interruptor de
# encendido y apagado es uno y está arriba: `integrations.telegram.send_enabled`,
# que se comprueba dentro de `send()`, en el único sitio por el que pasan todos
# los envíos.
#
# Hubo aquí un `enabled: true` que no leía nadie, y tres `send_on_*` igual de
# decorativos. Un interruptor desconectado es peor que no tenerlo: quien pusiera
# `enabled: false` para callar el bot habría seguido recibiendo mensajes, con el
# config dándole la razón por escrito. El validador ahora rechaza al arrancar
# cualquier clave de esta sección que el código no lea.
notifications:
  telegram:
    # El token y el chat ID van en .env, NUNCA aquí.
    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
    include_reasoning: true     # incluye qué regla disparó el semáforo


# -----------------------------------------------------------------------------
# 12. CAPA DE TENDENCIA
# -----------------------------------------------------------------------------
# Lo que NINGUNA regla del semáforo puede ver, porque ninguna mira más de tres
# días atrás: `hrv_hundida_2d` llega a 2, `carga_acumulada` a 3, y ahí se acaba.
# El motor decide bien cada mañana y el conjunto se le escapa entero.
#
# El replay de los 179 días de marzo a agosto lo dejó medido: el reparto de
# colores casi no se movió entre la primera mitad y la segunda, y la composición
# de lo que los disparaba se dio la vuelta. El color no se movió, la razón sí, y
# nadie lo habría dicho porque nadie lo estaba mirando.
#
# Esta capa NO decide: no toca el semáforo, ni la progresión, ni la sesión. Solo
# escribe frases en el mensaje de la mañana. Si se pone `enabled: false`, el
# sistema entrena exactamente igual y lo único que se pierde es saber hacia
# dónde va. Lo lee `app/engine/tendencia.py`.
#
#
# POR QUÉ ESTOS CINCO NÚMEROS SON ABSOLUTOS Y NO ADAPTATIVOS
# ----------------------------------------------------------
# QUE NADIE LOS "ARREGLE" VOLVIÉNDOLOS RELATIVOS. Es la excepción deliberada a
# la preferencia general del proyecto -comparar contra la propia distribución
# histórica en vez de contra constantes-, y el motivo es concreto y está medido.
#
# `adaptive_thresholds` tiene sentido donde lo tiene: el p90 de la carga de 3
# días es MI p90, y una constante ahí solo sería el p90 de otra persona. Pero
# `hrv_ratio` enseña el límite de la idea: divide el HRV de hoy entre la media
# de los 7 días anteriores, y como el denominador persigue al numerador, el
# cociente no se sale de 0,91–1,04 en seis meses enteros. Es un filtro de paso
# alto: solo deja pasar los cambios rápidos y borra las derivas lentas.
#
# Una capa de tendencia con umbrales relativos sería ese mismo filtro un piso
# más arriba, y con un efecto peor: una racha mala LARGA subiría poco a poco el
# listón de lo que cuenta como "normal", y la capa se quedaría callada justo el
# mes en que hay algo que contar. Un indicador que se adapta a lo que mide no
# mide nada.
#
# Así que se calibran una vez contra el histórico y se cambian A MANO. La
# herramienta para hacerlo existe y es obligatorio usarla antes de tocar
# cualquiera de estos valores:
#
#     python scripts/replay_semaforo.py --tendencia
#
# Sin falsarlos contra los datos, dentro de un año estos cinco números serían
# folklore: nadie sabría de dónde salieron ni qué pasa si se mueven.
trend:
  enabled: true

  # DETECTOR 1 — RACHA. Días seguidos sin un verde.
  # Es el único de los tres que avisa PRONTO. Cinco sale del histórico: en los
  # 179 días replicados hubo rachas de 2, 3 y 4 días con frecuencia -son ruido
  # normal- y las de 5 o más se contaron con los dedos de una mano. Bajarlo a 4
  # convierte el aviso en rutina y deja de leerse; subirlo a 7 lo reserva para
  # cuando ya no hace falta que nadie lo diga.
  #
  # Un hueco de calendario (un día que el sistema no corrió) NO rompe la racha,
  # porque un apagón no es un verde. Se cuenta aparte y el aviso lo nombra.
  racha_min: 5

  # DETECTOR 2 — VENTANA. El último mes contra LOS DOS ANTERIORES.
  # LLEGA TARDE Y LO SABE. Se queda porque confirmar "el último mes ha ido peor
  # que los dos de antes" tiene valor aunque no anticipe nada, pero el texto del
  # mensaje se etiqueta como RETROSPECTIVO con todas las letras: si se lee como
  # una alerta temprana, engaña. Ver `_detecta_ventana`.
  #
  # LAS DOS VENTANAS NO SE SOLAPAN, Y ESO NO ES UN DETALLE
  # -----------------------------------------------------
  # `ventana_larga_dias: 90` NO son los últimos 90 días: son los 60 ANTERIORES a
  # los 30 recientes (90 - 30). Antes sí eran los 90 completos, con los 30 de la
  # ventana corta metidos dentro, y ese anidamiento hacía justo lo contrario de
  # lo que se buscaba: un mes malo se metía él solo en su propia referencia, se
  # subía el listón y se tapaba. Es el mismo filtro de paso alto que estropea a
  # `hrv_ratio`, un piso más arriba.
  #
  # Medido sobre los 179 días, el anidamiento amortiguaba la señal ~un tercio:
  #
  #                        solapadas      disjuntas
  #     p50                    1,7            2,5
  #     p75                    8,9           13,3
  #     p90                   16,7           25,0
  #     máximo                23,3           35,0
  #     días que disparan     13 de 90       22 de 90
  #
  # OJO AL LEER `delta_pp_min: 15`: se eligió como "el primer escalón por encima
  # del ruido" cuando el ruido -medido mal- iba de 6 a 11 puntos. Con las
  # ventanas bien, la banda de ruido sube a p75 = 13,3 y el 15 se queda pegado a
  # ella: pasa de marcar el 12% de los días peores a marcar el 24%. Sigue
  # disparando en los tramos que tiene que marcar, así que se DEJA COMO ESTÁ a
  # propósito, pero ya no significa lo que decía su motivo. Pendiente de decidir
  # a mano con `--tendencia` cuando haya decisiones de verdad (ver más abajo, la
  # misma pega es mucho peor en `caida_min_min`).
  ventana_corta_dias: 30
  ventana_larga_dias: 90
  delta_pp_min: 15

  # DETECTOR 3 — MOTIVO. El mismo TEMA manda semana tras semana.
  # Es el que dice QUÉ está pasando, y el único que sobrevive a que el reparto
  # de colores no se mueva. Solo cuenta semanas ISO COMPLETAS: contar la semana
  # en curso haría que un lunes malo pareciera "una semana mala" y que la frase
  # del jueves contradijese a la del lunes sin que hubiera pasado nada nuevo.
  #
  # Manda un TEMA, no una regla concreta. `sueno_corto` y `sueno_muy_corto` son
  # el mismo problema a dos intensidades, igual que `hrv_baja_1d` y
  # `hrv_hundida_2d`: contándolas por separado se fabricaban empates que no
  # existían y el detector no disparaba NI UNA VEZ en 179 días. La lista de
  # temas vive en app/engine/tendencia.py.
  #
  # Una semana sin dominante -un empate, o una semana tan tranquila que apenas
  # disparó nada- NO rompe la racha: no dice que el tema haya cambiado, dice que
  # esa semana no dice nada, que no es lo mismo. Dos seguidas sí la rompen. Lo
  # que la rompe de verdad es que mande OTRO tema. El ordinal cuenta solo las
  # semanas que mandaron y el mensaje nombra el tramo abarcado, para que el
  # hueco no se esconda dentro del número.
  #
  # Cuatro semanas es un mes: menos es una mala racha, que ya la cuenta el
  # detector 1.
  motivo_semanas_min: 4

  # CUALIFICADOR DE SUEÑO.
  # `sleep_score` no dispara ninguna regla del semáforo y no va a dispararla: la
  # regla del cuadrante de disociación (dormí bastante y dormí mal) disparaba 4
  # veces en seis meses sin añadir un solo día nuevo, que es la definición de
  # opción muerta. Su sitio es este.
  #
  # Cuando un aviso de esta capa ya ha señalado al sueño, esto separa cantidad
  # de calidad, que son dos problemas con dos arreglos distintos: dormir menos
  # se arregla acostándose antes; dormir lo mismo y peor, no.
  #
  # LOS DOS NÚMEROS SALEN DE MEDIR, NO DE ESTIMAR. La primera versión de este
  # bloque decía 20 min y 5 puntos "porque son las caídas que separan un mes
  # normal de uno malo". Era mentira con buena prosa: al pasarle `--tendencia`
  # resultó que un umbral de 5 no se alcanzaba NUNCA, así que dos de los cuatro
  # veredictos del cualificador -"es calidad" y "son las dos cosas"- eran
  # opciones muertas recién nacidas. Este es justo el fallo que la herramienta
  # existe para cazar, y lo cazó antes de la primera ejecución de verdad.
  #
  # AQUÍ TAMBIÉN SE MIDE CONTRA LOS 60 DÍAS ANTERIORES, NO CONTRA LOS 90.
  # Mismo arreglo y mismo motivo que en el detector 2: con los 30 recientes
  # metidos dentro de su propia referencia, un mes durmiendo mal se comparaba en
  # parte consigo mismo. Y estos dos umbrales se calibraron CON LA MEDIDA VIEJA,
  # así que el arreglo los ha movido de sitio sin tocarles el número:
  #
  #                              solapadas        disjuntas
  #     caída de sleep_score
  #       p50 / p75 / p90       0,3 / 0,7 / 1,4   0,4 / 1,1 / 2,1
  #       máximo                    2,6               4,0
  #       días que disparan (>=2)   4 de 90          12 de 90
  #     caída de sleep_min
  #       p50 / p75 / p90      12,2 / 16,9 / 19,6  18,4 / 25,4 / 29,4
  #       máximo                   25,9              38,9
  #       días que disparan (>=18) 17 de 90          47 de 90
  #
  # DECIDIDO A MANO DESPUÉS, EN SU PROPIO COMMIT, MIRANDO ESTA TABLA:
  #
  #   caida_min_min: 18 → 25. Era el único de los tres que estaba roto de
  #   verdad. Se eligió entre el p75 y el p90 de la medida vieja; con la medida
  #   buena el p50 es 18,4, o sea que el umbral había quedado POR DEBAJO DE LA
  #   MEDIANA. Un cualificador que dice "es cantidad" más de la mitad de las
  #   mañanas no cualifica nada: describe el clima. 25 lo devuelve justo por
  #   encima del p75 (25,4), que es donde estaba pensado.
  #
  #   caida_score_min: 2 se queda. Se eligió como "el doble del p90" cuando el
  #   p90 era 1,0 y ahora el p90 es 2,1, así que el motivo escrito ya no
  #   describe el sitio -pero el sitio es bueno igual: marca el 13% de días
  #   peores. Moverlo sin un motivo mejor que "el argumento viejo ha caducado"
  #   sería tocar por tocar.
  #
  #   delta_pp_min: 15 se queda, y aquí el criterio es DISTINTO a propósito. Ha
  #   pasado de marcar el 12% de los días peores al 24%, que en el cualificador
  #   habría sido motivo de subirlo. Aquí no: el detector 2 es confirmatorio y
  #   está etiquetado RETROSPECTIVO en el propio texto, así que hablar más a
  #   menudo no engaña a nadie. Lo que no puede es quedarse callado el mes que
  #   hace falta. Si algún día se le quita la etiqueta, este umbral vuelve a
  #   discusión.
  #
  # EFECTO MEDIDO DE SUBIR A 25, sobre los 179 días (día a día, sin agrupar):
  #
  #                          con 18        con 25
  #     días con cualificador   26            26
  #     "es cantidad"           12             6
  #     "ninguna de las dos"    14            20
  #     "es calidad"             0             0
  #     "las dos cosas"          0             0
  #
  # Los dos veredictos de calidad siguen en cero y eso NO es un umbral mal
  # puesto: es el histórico diciendo que cuando el motor señaló al sueño fue
  # siempre cantidad. Si `caida_score_min` nunca dispara con datos reales de
  # aquí a unos meses, entonces sí habrá que decidir si sobra.
  #
  # Lo que dice el histórico: cuando el motor señaló al sueño, SIEMPRE fue
  # cantidad y nunca calidad. En esos días Garmin puntuaba el sueño igual o
  # mejor; lo que bajaba era el tiempo en la cama. Por eso el veredicto "no es
  # ninguna de las dos" también es una respuesta y no un hueco: dice que se
  # movió el umbral, no el descanso.
  sueno:
    caida_score_min: 2
    caida_min_min: 25


# =============================================================================
# metrics — cómo se cuenta EN CASTELLANO lo que sale del cálculo
# =============================================================================
# Esta sección no cambia ningún número: cambia cómo se cuentan. Existe porque el
# panel venía escrito en el lenguaje del cálculo -"correlación significativa
# tras Benjamini-Hochberg", "r = -0.3558", "n = 173"- y eso no es información
# para quien lo lee cada mañana: es la factura del método.
#
# Vive aquí y no en el JavaScript por el mismo motivo que todo lo demás. El
# front no escribe a mano ni un deslizador ni una regla; si estas bandas y estos
# grupos estuvieran en `static/`, añadir una exposición nueva al análisis la
# dejaría fuera de la portada sin un solo error, que es exactamente la familia
# de fallos que este proyecto lleva meses cazando.
metrics:

  # --- Cuántos hallazgos caben en la portada --------------------------------
  # Cinco. No es un límite técnico: es que una portada con veintisiete cosas no
  # es una portada, es la vista de Impacto con otro nombre. El resto no se
  # esconde -está entero en la vista, a un toque-, pero lo que se ve al entrar
  # tiene que caber en una pantalla y leerse sin decidir nada.
  hallazgos_en_portada: 5

  # --- Las bandas de |r|, que es lo que sustituye al coeficiente -------------
  # El número NO desaparece: sigue en la ficha de cada hallazgo, con su p, su p
  # corregida y su n. Lo que hace la banda es PRECEDERLO, para que la primera
  # lectura sea una frase y no una cifra que hay que saber interpretar.
  #
  # Los cortes son los convencionales de Cohen (0,1 / 0,3 / 0,5) movidos un poco
  # arriba en el primero. Motivo medido: con 173 días, un |r| de 0,15 sale
  # significativo sin problema y no significa nada que se pueda notar montando
  # en bici. Llamarlo "se nota" sería verdad estadística y mentira práctica.
  #
  # Por debajo de `se_nota_poco` la relación no se cuenta como hallazgo aunque
  # el filtro de azar la deje pasar. Queda en la vista con su número.
  fuerza_relacion:
    se_nota_poco: 0.20
    se_nota: 0.35
    se_nota_mucho: 0.50

  # --- Los grupos de exposición, que son GRUPOS DE DECISIONES ----------------
  # POR QUÉ SE AGRUPA, CON EL NÚMERO DELANTE
  # ----------------------------------------
  # Medido el 2026-09-13 sobre los 173 días de histórico real, las exposiciones
  # de bici no son variables distintas:
  #
  #     minutos_bici    vs desnivel_bici     r = 0,9986
  #     carga_bici      vs desnivel_bici     r = 0,9721
  #     carga_bici      vs minutos_bici      r = 0,9695
  #     bici_cualquiera vs minutos_bici      r = 0,9772
  #
  # Un 0,9986 no es "difícil de separar": es la misma columna medida en otra
  # unidad. Las cuatro suben y bajan juntas porque los días que no sale valen
  # cero las cuatro, y los días que sale, más rato es más metros y más carga.
  #
  # Sin agrupar, la portada enseñaría cuatro hallazgos que parecen cuatro
  # descubrimientos independientes -"los minutos te bajan la HRV", "la carga te
  # baja la HRV", "el desnivel te baja la HRV", "salir te baja la HRV"- y no lo
  # son: es UNO, contado cuatro veces. Eso no es solo repetitivo, es engañoso:
  # cuatro pruebas convencen más que una, y aquí no hay cuatro pruebas.
  #
  # Así que la unidad de la portada es el GRUPO, no la exposición. Dentro del
  # grupo se coge la relación más fuerte y las demás se citan como lo que son:
  # la misma señal confirmada por otro camino.
  #
  # CÓMO SE REPARTEN
  # ----------------
  # Una exposición cae en el grupo que la nombra en `exposiciones`. Si ninguno
  # la nombra, en el que reclame su `familia`. Si no cae en ninguno, el endpoint
  # REVIENTA en vez de dejarla fuera en silencio: una exposición huérfana es una
  # que se calcula, se manda por la red y no la ve nadie, que es el fallo del
  # desplegable de Impacto otra vez.
  #
  # `familias` existe porque las rutinas de fuerza se generan solas a partir de
  # lo que aparezca en `workout_log`: listarlas a mano aquí haría que una rutina
  # nueva quedase huérfana el día que se cree.
  grupos_exposicion:

    # Salir, y cuánto. Los cuatro colineales de arriba más los dos cortes por
    # duración, que son el mismo eje partido por un umbral.
    - clave: salir_en_bici
      titulo: Salir en bici
      decision: si sales y cuánto ruedas
      exposiciones:
        - bici_cualquiera
        - bici_larga
        - bici_corta
        - minutos_bici
        - carga_bici
        - desnivel_bici

    # Apretar. Este SÍ es un eje aparte: las tres intensidades van a ~0,5 con
    # los minutos, no a 0,99. Se puede salir mucho rato suave o poco rato duro,
    # y el histórico lo distingue.
    - clave: apretar_en_bici
      titulo: Apretar en la bici
      decision: cómo de fuerte vas cuando sales
      exposiciones:
        - bici_suave
        - bici_media
        - bici_intensa

    # Qué rutina toca. Por familia: `rutina_dia_1`, `rutina_dia_2` y las que
    # vengan. Hoy está vacío porque `workout_log` no tiene ni una fila.
    - clave: rutina_de_fuerza
      titulo: Qué rutina de fuerza haces
      decision: qué día de fuerza te toca
      familias:
        - rutina

    # Cuánto levantas. Volumen y series, que serán colineales entre ellas por el
    # mismo motivo que los minutos y el desnivel, pero eso todavía no se puede
    # medir: hacen falta semanas de sesiones apuntadas.
    - clave: volumen_de_fuerza
      titulo: Cuánto levantas
      decision: cuánto volumen metes en la sesión
      familias:
        - fuerza

    # Ejercicios sueltos. Van aparte y con la advertencia de confusión de
    # siempre: un ejercicio no se hace solo, se hace dentro de un día.
    - clave: ejercicio_suelto
      titulo: Ejercicios concretos
      decision: qué ejercicios metes
      familias:
        - ejercicio
