# -----------------------------------------------------------------------------
# 10. BLOQUES DE RECUPERACIÓN (días rojos)
# -----------------------------------------------------------------------------
# Sustituyen a la sesión de fuerza. Movilidad y core suave, nada de carga.
recovery_blocks:
  recuperacion_suave:
    title: "Recuperación"
    write_to_hevy: false      # no reescribe la rutina; solo se manda por Telegram
    exercises:
      - {key: dead_bug, template_id: "D8911FC4", name: "Dead bug", sets: [{reps: 15}, {reps: 15}]}
      - {key: perro_de_caza, template_id: "BD0AD077", name: "Perro de caza", sets: [{reps: 15}, {reps: 15}]}
      - {key: plancha, template_id: "C6C9B8A0", name: "Plancha", sets: [{duration_s: 20}, {duration_s: 20}]}
      - {key: caminar, template_id: "33EDD7DB", name: "Caminar 20-30 min suave", sets: [{}]}


# -----------------------------------------------------------------------------
# 11. PROGRAMACIÓN Y AVISOS
# -----------------------------------------------------------------------------
schedule:
  garmin_fetch_time: "06:30"    # lee Garmin antes de que te levantes
  fallback_decision_time: "09:00"   # si no hay check-in, decide solo con Garmin
  evening_summary_time: "22:30"     # captura lo entrenado para el histórico

  garmin_retry:
    attempts: 3
    backoff_seconds: [60, 300, 900]
    notify_on_final_failure: true

notifications:
  telegram:
    enabled: true
    # El token y el chat ID van en .env, NUNCA aquí.
    # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
    send_on_decision: true
    send_on_special_rule: true
    send_on_error: true
    include_reasoning: true     # incluye qué regla disparó el semáforo
