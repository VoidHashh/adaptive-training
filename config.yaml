      - key: curl_predicador
        template_id: "1E9A6B8E"
        name: "Curl predicador (máquina)"
        increment_kg: 1.25
        apply_to: top_set
        expendable_in_amber: true
        progression_type: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 10}
          - {reps: 12, weight_kg: 12.5}
          - {reps: 12, weight_kg: 13.75}
          - {reps: 12, weight_kg: 15}

      - key: extension_triceps_polea
        template_id: "CDC472B1"
        name: "Extensión de tríceps en polea"
        increment_kg: 2.5
        apply_to: top_set
        expendable_in_amber: true
        progression_type: double
        rep_range: [10, 12]
        sets:
          - {type: warmup, reps: 10, weight_kg: 10}
          - {reps: 12, weight_kg: 12.5}
          - {reps: 12, weight_kg: 12.5}
