# =============================================================================
# adaptive-training — configuración del motor de decisión
# =============================================================================
# Este archivo es la ÚNICA fuente de verdad de las rutinas y de los umbrales.
# El motor no usa ningún LLM: son reglas explícitas, deterministas y auditables.
#
# Importante: la API de Hevy (PUT /v1/routines/{id}) REEMPLAZA la rutina entera,
# no hace parche. Por eso las rutinas se definen aquí completas: cada mañana el
# sistema reconstruye la rutina del día desde este YAML aplicando la decisión.
# Si editas una rutina en la app de Hevy, el cambio se perderá en la siguiente
# escritura. Edítala aquí.
#
# Cada cambio de este archivo genera un config_hash distinto que se guarda con
# cada decisión, para poder saber con qué configuración se decidió cada día.
# =============================================================================

version: 1
timezone: Europe/Madrid


# -----------------------------------------------------------------------------
# 0-bis. PROGRAMA
# -----------------------------------------------------------------------------
# `start` es el origen desde el que se cuentan las semanas de descarga. NO es
# decorativo y NO puede quedarse vacío: sin él, `special_rules.semana_de_descarga`
# no tiene desde dónde contar `every_n_weeks` y la descarga no se activa NUNCA.
# Un sistema que progresa sin descargar es un sistema que acumula fatiga hasta
# que algo cede, y con 44 años, déficit calórico y una hernia L4-L5 eso no es un
# riesgo aceptable.
#
# Por eso el cargador se NIEGA A ARRANCAR si falta o está en null, en vez de
# apuntarlo en una nota del informe. Una nota se lee el primer día y se ignora
# el resto; un arranque fallido se arregla.
#
# Y TIENE QUE SER UN LUNES
# El motor no cuenta desde esta fecha: cuenta desde `week_start()` de esta
# fecha, porque las descargas empiezan siempre en lunes y un ciclo que arranca
# a mitad de semana partiría el microciclo en dos. Con un martes escrito aquí,
# el origen real es el lunes anterior y el valor que se lee en este fichero no
# es el que usa el sistema: la primera descarga parece adelantarse a las 6,9
# semanas cuando en realidad cae limpia en la semana 7. El redondeo no es el
# problema -es correcto-; el problema es que pasaba en silencio. Ahora el
# cargador exige el lunes, y así lo escrito y lo contado son lo mismo.
#
# Consecuencia práctica y buena: da igual qué día de la semana se encienda el
# sistema de verdad. Lo que hay que acertar es la SEMANA, no el día.
#
# LA RECALIBRACIÓN
# ----------------
# Varios umbrales de este fichero se calibraron sobre una muestra pequeña y con
# la promesa, escrita en un comentario, de "revisarlos a las cuatro semanas".
# Un comentario que pide que alguien se acuerde no es un recordatorio: es una
# nota que se lee el día que se escribe y no se vuelve a leer nunca. Las dos
# claves de abajo convierten esa promesa en algo que el sistema dice en voz
# alta por Telegram cuando toca.
#
# POR QUÉ SE CUENTAN DÍAS CON DECISIÓN Y NO DÍAS DE CALENDARIO
# Lo que hace recalibrable un umbral es la muestra acumulada, no el paso del
# tiempo: cuatro semanas de calendario con el sistema apagado dos no son cuatro
# semanas de datos, y avisar entonces invita a recalibrar sobre la mitad de la
# muestra que se creía tener. Se cuentan los días que tienen una decisión
# vigente guardada, que es exactamente la muestra con la que se va a recalibrar.
#
# POR QUÉ NO SE USA EL HASH DEL CONFIG
# La tentación era contar decisiones tomadas bajo el `config_hash` de hoy, con
# la gracia de que recalibrar cambia el hash y el contador se reinicia solo, sin
# tener que acordarse de nada. Pero el hash cambia con CUALQUIER edición: tocar
# `telegram.send_enabled` reiniciaría el contador de la recalibración sin que
# nadie haya recalibrado nada, y el aviso desaparecería sin haberse atendido.
# Un contador que se pone a cero por el motivo equivocado es peor que no
# tenerlo, porque además certifica que no hay nada pendiente.
program:
  # AAAA-MM-DD y LUNES. Origen del contador de descargas.
  #
  # Es el lunes de la semana en que el sistema empieza a decidir de verdad, no
  # el día en que se escribió este fichero. Estuvo en 2026-09-08 -un martes de
  # planificación, con la base de datos vacía- y eso dejaba el contador de
  # descargas corriendo sobre una semana que nadie entrenó.
  start: 2026-09-14

  # Cada cuántos días CON DECISIÓN GUARDADA vuelve a tocar revisar los umbrales
  # calibrados sobre muestras cortas. 28 = las cuatro semanas prometidas, pero
  # contadas en días de datos y no en días de hoja de calendario.
  recalibrar_cada_dias: 28

  # El último día en que se revisaron. Se cambia A MANO, y ese es el punto: la
  # única forma de callar el aviso es haber mirado. Vale igual si de la revisión
  # sale "no cambio nada" -se pone la fecha y el contador vuelve a empezar-,
  # porque decidir no tocar también es haber recalibrado.
  #
  # Arranca igual que `start`: el día cero del programa nada se había revisado
  # todavía, así que la primera cuenta va desde el principio. Esta sí puede ser
  # cualquier día de la semana: aquí no se redondea nada, se cuentan los días
  # con decisión desde ella.
  #
  # Tiene que caer entre `start` y el último de estos dos: hoy, o el propio
  # `start`. Lo segundo es por el caso de ahora mismo -se configura el sábado
  # para arrancar el lunes-, en que la única fecha posible es futura porque el
  # programa todavía no ha empezado. No pasa nada: lo que se cuentan son días
  # CON DECISIÓN, y antes del arranque no hay ninguna. Lo que sí se sigue
  # rechazando es la fecha muy por delante, que casi siempre es un año mal
  # escrito y dejaría el aviso mudo hasta entonces.
  recalibrado_el: 2026-09-14


# -----------------------------------------------------------------------------
# 0-ter. INTERRUPTORES DE ESCRITURA
# -----------------------------------------------------------------------------
# Todo lo que sale del sistema hacia fuera pasa por aquí.
#
# ABIERTOS DESDE EL 2026-09-14. Arrancaron apagados y la fase en seco se
# descartó a propósito: compraba poco. El motor está validado contra 179 días
# de repetición histórica, hay copia antes de cada PUT, y la reversión dejó de
# ser una función sin llamar el día 12 -ahora es `python -m app.rutina
# revertir`, probada de ida y vuelta contra Hevy de verdad-. El peor caso es
# una sesión rara que se corrige a mano en dos minutos.
#
# Lo que sigue siendo verdad, y por eso se queda escrito: `PUT
# /v1/routines/{id}` REEMPLAZA la rutina entera. El coste de una decisión mal
# construida no es un mal día de entreno, es una rutina destruida. De ahí que
# la copia previa no sea configurable -sin copia verificada no se escribe- y
# que la reversión exista como comando y no como idea.
#
# CAMBIAR ESTO NO BASTA CON GUARDAR EL FICHERO. El `config.yaml` se carga una
# vez por proceso: hay que recrear el contenedor y comprobarlo después.
#   docker compose -f docker-compose.yml -f docker-compose.pruebas-lan.yml \
#     up -d --force-recreate app
#   curl -s localhost:8317/api/health | python -m json.tool
# En `config_file.in_sync` sale `false` mientras el fichero del disco no sea el
# que está decidiendo, que es justo el fallo que este proyecto ha cometido ya
# tres veces con la imagen, el esquema y el Caddyfile.
#
# LOS DOS `-f` NO SON DECORACIÓN. Aquí había escrito `docker compose up -d
# --force-recreate app` a secas, y ese comando es el que rompió el 12 de
# septiembre: sin la superposición, el compose de la raíz monta `./data` como
# bind mount de Windows en lugar del volumen nombrado, así que el contenedor
# arranca apuntando a OTRO directorio de datos -otra base, otras copias de
# Hevy, otros tokens de Garmin- y contesta `status: ok` igual de convencido.
# `auth_front` en el health es el testigo: en este PC tiene que decir
# «ninguna»; si dice «sin_declarar», se levantó con el compose equivocado.
#
# El interruptor NO afecta a la reversión: si algo se rompió mientras estaba
# encendido, se puede deshacer aunque luego se apague.
integrations:
  hevy:
    write_enabled: true

    # Copias de seguridad antes de cada escritura. No es configurable que se
    # hagan —sin copia verificada no se escribe, y eso está en el código— pero
    # sí cuántas se conservan.
    backup:
      keep_last: 30

  telegram:
    send_enabled: true   # los mensajes sí se envían: leer no rompe nada


# -----------------------------------------------------------------------------
# 0. RESTRICCIONES DE SEGURIDAD — hernia discal L4-L5
# -----------------------------------------------------------------------------
# Esto NO es un umbral que se recalibre: es una restricción permanente. El
# cargador de configuración se niega a arrancar si alguna rutina HIIT contiene
# un ejercicio de esta lista, para que un cambio hecho con prisa en Hevy y
# copiado aquí no meta un patrón contraindicado sin que nadie se dé cuenta.
#
# Ámbito: SOLO las rutinas HIIT. En la fuerza normal el peso muerto sí está
# permitido (Día 2) porque va controlado, a repeticiones bajas y con la regla
# `retirada_peso_muerto` vigilándolo. Lo que se prohíbe es ese mismo patrón
# ejecutado con prisa y bajo fatiga, que es lo que define un HIIT.
#
# La condición que motiva todo esto es una hernia discal L4-L5. Va como
# comentario y no como clave: `condition: "Hernia discal L4-L5"` estuvo aquí
# sin que lo leyera nadie, y una clave se lee como un interruptor -algo que el
# código consulta y que cambiaría de comportamiento si se cambia-. Cambiar ese
# texto no habría desbloqueado ni un ejercicio. Lo que de verdad manda es la
# lista de `template_ids` de abajo.
safety:
  forbidden_in_hiit:
    reason: >
      Ningún ejercicio con flexión lumbar repetida bajo carga ni con carga
      axial explosiva puede entrar en las rutinas HIIT.

    # Bloqueo por template_id: es el criterio fuerte, independiente del idioma
    # y del nombre que le pongamos aquí. IDs verificados contra el catálogo
    # real de Hevy (453 plantillas).
